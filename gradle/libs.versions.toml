[versions]
# Oldest supported Paper API: the plugin is compiled against it, and plugin.yml's api-version comes
# from it (26.2.build.135-stable -> 26.2). Paper 26.2 is finished, so this one is updated by hand
# and stays out of [libraries], where Dependabot would move it to the newest version.
paper-api-min = "26.2.build.135-stable"
# Newest supported Paper API: tests and the compileAgainstLatest check. Updated by Dependabot.
paper-api = "26.3.build.231-stable"
# Libraries that Paper already brings (the versions of paper-api-min): core compiles against them
# without bundling them, so they stay out of [libraries], where Dependabot would move them past what
# the oldest supported Paper has.
adventure = "5.2.0"
snakeyaml = "2.2"
gson = "2.14.0"
brigadier = "1.3.10"
junit = "6.1.3"
bstats = "3.2.1"
shadow = "9.6.1"
sonarqube = "7.5.0.8588"
# Mods (Fabric and NeoForge). The Minecraft version and what is tied to it (NeoForm, Fabric API,
# NeoForge, adventure-platform-mod) stay out of [libraries]: Dependabot would move them to the next
# Minecraft. The build tools (Loom, ModDevGradle) are plugins and get updated.
minecraft = "26.3"
neoform = "26.3-1"
fabric-loader = "0.20.1"
fabric-api = "0.165.2+26.3"
neoforge = "26.3.0.101"
adventurePlatformMod = "7.2.0"
# Mixin and MixinExtras come with both loaders: the shared mod code compiles against them only.
sponge-mixin = "0.17.3+mixin.0.8.7"
mixinextras = "0.5.3"
fabric-loom = "1.19.4"
moddev = "2.0.148"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
bstats-bukkit = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
moddev = { id = "net.neoforged.moddev", version.ref = "moddev" }
