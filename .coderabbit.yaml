# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews pull requests into the default branch (main) on its own; this adds the ones into
# dev. Reference: https://docs.coderabbit.ai/reference/configuration
reviews:
  auto_review:
    base_branches:
      - "^dev$"
  # Files left out of reviews (a review takes at most 300 files):
  path_filters:
    # the code before the split into modules, removed
    - "!src/**"
    # the translations (LanguageFilesTest checks their keys and placeholders)
    - "!**/lang/*.yml"
    # generated by ./gradlew updateDaemonJvm
    - "!gradle/gradle-daemon-jvm.properties"
    # generated by ./gradlew --write-verification-metadata sha256 build
    - "!gradle/verification-metadata.xml"
    # data for the release notes
    - "!.github/release-notes-overrides.txt"
