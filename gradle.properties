# Plugin version: the release workflow bumps it on every merge into main, don't change it by hand.
version=2.0.0
# FastStats project token (https://faststats.dev); empty turns the statistics off. It is not a secret:
# it only lets the plugin send to this project, and it goes inside the jar.
faststatsToken=2df63f4fea694c539b52eb552ce3ec65
# Minecraft versions the mods are built for, one jar each per loader (the Paper plugin is one jar for all).
# The versions tied to each one are in gradle/libs.versions.toml (mc<version>-...).
minecraftVersions=26.2,26.3
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
