# ==============================================================================
#  Manhunt* — mensagens (formato MiniMessage: https://docs.advntr.dev/minimessage/format.html)
#  Os textos entre <...> como <bot>, <fase>, <quantidade> são preenchidos pelo plugin.
# ==============================================================================

prefixo: "<dark_red><bold>Manhunt*</bold></dark_red> <dark_gray>»</dark_gray> "

ajuda: |-
  <dark_red><bold>Manhunt*</bold></dark_red> <gray>(bots caçadores de ManHunt)</gray>
  <yellow>/bot create <nome> [qtd] [dificuldade] [fase] [agressividade]</yellow> <gray>— cria bots aqui</gray>
  <yellow>/bot create <nome> <qtd> <dificuldade> skin <jogador> [fase] [agr]</yellow> <gray>— com skin de outro jogador</gray>
  <yellow>/bot spawn <nome> <qtd> <dificuldade> <x> <y> <z> [fase] [agr]</yellow> <gray>— cria em coordenadas</gray>
  <yellow>/bot start</yellow> <gray>— começa a caçada agora (solta as rodas e pula a contagem)</gray>
  <yellow>/bot roda [ponto [x y z] | ponto limpar]</yellow> <gray>— ponto fixo da roda</gray>
  <yellow>/bot lista [add|remove <jogador> | modo desligada|permitidos|bloqueados]</yellow> <gray>— quem é caçado</gray>
  <yellow>/bot menu</yellow> <gray>— menu com tudo</gray>
  <yellow>/bot list · info · remove · tp · tpall · target · cleartarget</yellow>
  <yellow>/bot settings <chave> <valor></yellow> <gray>— opções (sem argumentos mostra todas)</gray>
  <yellow>/bot group role|enemy|spawnpoint|phaseprogression|trackplayers|delete</yellow>
  <yellow>/bot skin <bot> <jogador> · give <item> · armor <tier> · execute <capacidade></yellow>
  <yellow>/bot deleteall confirm · reload</yellow> <gray>— e /mansave spawn|clear</gray>

# --- fases ---
fase:
  salto: "<red>[SALTO DE FASE]</red> <white><bot></white> <gray>fase</gray> <yellow><de></yellow> <gray>→</gray> <gold><para></gold> <gray>(<motivo> de <white><jogador></white>).</gray>"
  motivo:
    nether: "entrou no Nether"
    diamantes: "5+ diamantes no inventário"
    muito-ferro: "mais de 20 de ferro"
    ferro: "ferro no inventário"
    arma-madeira: "arma de madeira"
  upgrade: "<dark_red><bold>[BOTS MAIS FORTES]</bold></dark_red> <gold>Fase <fase> alcançada!</gold>"
  descricao:
    "1": "<gray>Bot básico: sem equipamento de fase; persegue, cava, faz pontes e se vira.</gray>"
    "2": "<gray>Espada de madeira e comida básica. Arma de madeira do jogador força esta fase.</gray>"
    "3": "<gray>Liberam a besta e o balde de água contra fogo; comida melhor.</gray>"
    "4": "<gray>Armadura de couro, espada de pedra, escudo, tridente com lealdade, cavalos e rajada de arco.</gray>"
    "5": "<gray>Armadura e espada de ferro, balde de lava e maçãs douradas.</gray>"
    "6": "<gray>Ferro com Proteção I, drops melhores e barcos contra alvos na água.</gray>"
    "7": "<gray>Espada de diamante, parte da armadura de diamante e drops mais fortes.</gray>"
    "8": "<gray>Diamante completo com Proteção II e espada com Afiação II.</gray>"
    "9": "<gray>Mantém o diamante encantado e a recarga da pérola cai 50%.</gray>"
    "10": "<gray>Mantém o diamante encantado e a recarga da pérola cai 75%.</gray>"
    "11": "<gray>Os bots ficaram mais fortes.</gray>"
    "12": "<dark_red>Fase final (só Terminator): armadura de netherite e espada de netherite com Repulsão.</dark_red>"

# --- roda e contagem antes da caçada ---
contagem:
  roda-criada: "<gold>Os caçadores estão na roda.</gold> <gray>Quando um jogador sair dela, começa a contagem de</gray> <yellow><segundos></yellow> <gray>segundos. Use /bot start para começar já.</gray>"
  roda-criada-sem-contagem: "<gold>Os caçadores estão na roda.</gold> <gray>Quando um jogador sair dela, a caçada começa. Use /bot start para começar já.</gray>"
  barra-esperando: "<yellow>Saia da roda para começar</yellow> <gray>(<segundos>s de vantagem)</gray>"
  barra-esperando-sem-contagem: "<yellow>Saia da roda para começar a caçada</yellow>"
  saiu: "<yellow><jogador></yellow> <gold>saiu da roda!</gold>"
  saiu-e-contando: "<yellow><jogador></yellow> <gold>saiu da roda! A caçada começa em</gold> <yellow><segundos></yellow> <gold>segundos.</gold>"
  iniciada: "<gold>A caçada começa em <yellow><segundos></yellow> segundos!</gold> <gray>Use /bot start para começar já.</gray>"
  barra: "<red>A caçada começa em</red> <yellow><segundos>s</yellow>"
  titulo-numero: "<red><bold><segundos></bold></red>"
  subtitulo: "<gray>Prepare-se...</gray>"
  comecou-titulo: "<dark_red><bold>A caçada começou!</bold></dark_red>"
  comecou-subtitulo: "<gray>Corra.</gray>"
  comecou: "<dark_red>A caçada começou!</dark_red>"
  nada: "<gray>Não há bots esperando na roda.</gray>"

roda:
  info: |-
    <gold>Roda</gold> <gray>· raio</gray> <white><raio></white> <gray>· centro</gray> <white><centro></white> <gray>· ponto</gray> <white><ponto></white>
    <gray>Rodas esperando agora:</gray> <white><rodas></white> <gray>(raio: /bot settings ringradius, em blocos ou auto)</gray>
  ponto-marcado: "<green>Ponto da roda marcado em <white><pos></white> (<white><mundo></white>). As próximas rodas nascem aqui (centro da roda: manual).</green>"
  ponto-limpo: "<green>Ponto da roda apagado. As rodas voltam a nascer onde são criadas (centro da roda: automático).</green>"
  sem-ponto: "<yellow>O centro da roda está em manual, mas não há ponto marcado (ou o mundo dele não está carregado): a roda fica onde você está. Marque com /bot roda ponto.</yellow>"

# --- quem é caçado: lista de jogadores e quem entra no meio ---
lista:
  info: "<gold>Lista de jogadores</gold> <gray>(<modo>):</gray> <white><nomes></white>"
  vazia: "ninguém"
  adicionado: "<green><white><jogador></white> entrou na lista.</green>"
  ja-esta: "<yellow><white><jogador></white> já está na lista.</yellow>"
  removido: "<green><white><jogador></white> saiu da lista.</green>"
  nao-esta: "<yellow><white><jogador></white> não está na lista.</yellow>"
  aviso-desligada: "<gray>A lista está desligada: use /bot lista modo permitidos ou bloqueados para ela valer.</gray>"
  modo: "<green>Lista de jogadores: <yellow><modo></yellow>.</green> <gray><explicacao></gray>"
  explicacao:
    desligada: "Todos podem ser caçados e disparar a roda."
    permitidos: "Só os da lista são caçados e disparam a roda."
    bloqueados: "Os da lista não são caçados nem disparam a roda."

cacada:
  entrou-cacado: "<red>A caçada está em andamento: você já é um alvo!</red>"
  entrou-protegido: "<gold>A caçada está em andamento.</gold> <gray>Você fica</gray> <yellow><segundos></yellow> <gray>segundos protegido dos caçadores.</gray>"
  entrou-fora: "<gray>A caçada está em andamento. Você não será caçado até a próxima.</gray>"
  protecao-barra: "<green>Protegido dos caçadores:</green> <yellow><segundos>s</yellow>"
  protecao-acabou-barra: "<red>Sua proteção acabou!</red>"
  protecao-acabou: "<red>Sua proteção acabou: os caçadores agora vêm atrás de você!</red>"

