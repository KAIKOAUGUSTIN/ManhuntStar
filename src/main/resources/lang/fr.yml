    description: "Embuscade en grotte avec un lit (le bot réapparaît près du lit)."
  caveambushcooldown:
    name: "Intervalle entre embuscades (s)"
    description: "Secondes entre un bot et le suivant qui part en embuscade (1 = comme le mod)."
  autocapacities:
    name: "TNT et feux d'artifice automatiques"
    description: "Embuscade à la TNT et arbalète à feux d'artifice automatiques (bloquées dans le mod)."
  fireworkcrossbow:
    name: "Arbalète à feux d'artifice"
    description: "Arbalète à feux d'artifice (expérimentale dans le mod). Le bot ne tire qu'avec le joueur à portée (environ 64 blocs, sans bloc sur le trajet)."
  bowpressure:
    name: "Rafale d'arc"
    description: "Rafale d'arc quand le bot passe trop de temps sans toucher le joueur. Il ne tire que si la flèche atteint le joueur."
  silentdeaths:
    name: "Morts silencieuses"
    description: "Le bot le plus loin de chaque joueur (200+ blocs) disparaît et réapparaît plus près."
  portalentrance:
    name: "Arriver par un portail"
    description: "Les bots arrivent dans une autre dimension par un portail que le joueur voit."
  spawnmode:
    name: "Mode d'apparition"
    description: "NORMAL : apparaît au point. MANHUNT : apparaît en cercle et attend le début de la chasse."
  countdown:
    name: "Compte à rebours avant la chasse (s)"
    description: "Compte à rebours (secondes) avant le début de la chasse. 0 = libérés dès que quelqu'un sort du cercle."
  countdownonleave:
    name: "Compter seulement à la sortie du cercle"
    description: "Le compte à rebours ne commence que quand un joueur qui était dans le cercle en sort ; d'ici là, les bots attendent. Désactivé = il commence dès la création des bots."
  countdowninvulnerable:
    name: "Bots invulnérables dans le cercle"
    description: "Les bots du cercle ne subissent aucun dégât pendant l'attente et le compte à rebours."
  ringradius:
    name: "Rayon du cercle (0 = automatique)"
    description: "Rayon du cercle en blocs. 0 = automatique (5 blocs + 1 tous les 5 bots)."
  ringcenter:
    name: "Centre du cercle"
    description: "auto = le cercle reste là où il est créé ; manual = au point placé avec /manhunt ring point."
  latejoin:
    name: "Arrivées en cours de chasse"
    description: "Qui arrive pendant la chasse : hunted = devient une cible tout de suite ; protected = n'est pas une cible pendant le compte à rebours (au moins 5 s) ; out = n'est pas chassé avant la prochaine chasse."
  playerlistmode:
    name: "Liste de joueurs"
    description: "off = tout le monde peut être chassé ; allowlist = seuls les joueurs de la liste sont chassés et déclenchent le cercle ; blocklist = les joueurs de la liste ne sont pas chassés et ne déclenchent pas le cercle."
  glowhunters:
    name: "Surbrillance des chasseurs"
    description: "Surbrillance (contour visible à travers les murs) sur les chasseurs."
  glowhunterscolor:
    name: "Couleur de surbrillance des chasseurs"
    description: "Couleur de surbrillance des chasseurs."
  glowescapers:
    name: "Surbrillance des fugitifs"
    description: "Surbrillance sur les bots des groupes fugitifs."
  glowescaperscolor:
    name: "Couleur de surbrillance des fugitifs"
    description: "Couleur de surbrillance des fugitifs."
  nametag:
    name: "Nom au-dessus du bot"
    description: "Nom visible au-dessus du bot."

