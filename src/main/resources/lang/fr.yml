# --- nom et description de chaque option dans le menu (la clé est celle de /manhunt settings) ---
options:
  language:
    name: "Langue"
    description: "Langue des messages et du menu : un fichier du dossier lang/. Les textes manquants restent en anglais."
  tablist:
    name: "Bots dans la liste TAB"
    description: "Les bots apparaissent dans la liste TAB comme des joueurs (avec skin et ping)."
  joinmessages:
    name: "Messages d'arrivée et de départ"
    description: "« X a rejoint la partie » / « X a quitté la partie » quand un bot est créé ou supprimé."
  deathmessages:
    name: "Messages de mort"
    description: "Messages de mort des bots au format du jeu (suit la gamerule des messages de mort)."
  serverlistcount:
    name: "Compter dans la liste des serveurs"
    description: "Les bots comptent dans les joueurs en ligne et les noms de la liste des serveurs."
  listcommand:
    name: "Bots dans /list"
    description: "/list inclut les bots (même format que le jeu)."
  respectpvp:
    name: "Respecter le PvP désactivé"
    description: "Avec le pvp désactivé dans le monde, les bots ne frappent pas les joueurs."
  mineskin:
    name: "Skin de secours via MineSkin"
    description: "Sans skin pour le nom choisi, utilise la première image .png du dossier skins/ (ou le robot du mod), envoyée une fois à MineSkin pour obtenir une signature."
  bothealth:
    name: "Vie maximale"
    description: "Vie maximale des bots."
  botinvincible:
    name: "Bots invincibles"
    description: "Les bots ne subissent aucun dégât (sauf le vide et /kill)."
  respawn:
    name: "Réapparaître après la mort"
    description: "Les bots réapparaissent 5 s après leur mort."
  persistentbots:
    name: "Garder les bots au redémarrage"
    description: "Les bots existent toujours après un redémarrage du serveur (bots.yml)."
  dropinventory:
    name: "Lâcher l'inventaire à la mort"
    description: "Les bots lâchent leur inventaire quand ils meurent."
  gearpersistence:
    name: "Équipement à la mort"
