  autogapple:
    name: "Pommes dorées en combat"
    description: "Les bots mangent des pommes dorées en combat (phase 5+)."
  firewaterescape:
    name: "Éteindre le feu avec de l'eau"
    description: "Les bots éteignent le feu avec un seau d'eau (phase 3+)."
  mobsattackbots:
    name: "Les mobs attaquent les bots"
    description: "Les mobs hostiles attaquent les bots comme ils attaquent les joueurs."
  aimsmoothness:
    name: "Lissage de la visée (ms)"
    description: "Lissage de la visée en millisecondes (0 = instantané, comme le mod par défaut)."
  targetpriority:
