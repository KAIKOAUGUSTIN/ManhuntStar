# ==============================================================================
#  Manhunt* - Français
#  Format MiniMessage : https://docs.advntr.dev/minimessage/format.html
#  Les balises comme <bot>, <phase> et <amount> sont remplies par le plugin ; gardez-les en traduisant.
#  Les clés manquantes utilisent le texte anglais (en.yml). « version » change quand les textes par
#  défaut changent : un fichier plus ancien est déplacé dans lang/old/ et remplacé par le nouveau.
# ==============================================================================

version: 1

prefix: "<dark_red><bold>Manhunt*</bold></dark_red> <dark_gray>»</dark_gray> "

help: |-
  <dark_red><bold>Manhunt*</bold></dark_red> <gray>(bots chasseurs de ManHunt) ·</gray> <yellow>/manhunt menu</yellow> <gray>ouvre le menu</gray>
  <gold>Partie</gold>
  <yellow>/manhunt start</yellow> <gray>- libère les cercles et lance la chasse tout de suite</gray>
  <yellow>/manhunt pause · resume</yellow> <gray>- fige les bots et les compteurs / reprend</gray>
  <yellow>/manhunt target <player> · target clear</yellow> <gray>- tous après un joueur / retour à la normale</gray>
  <yellow>/manhunt ring · ring point [x y z | clear]</yellow> <gray>- le cercle et son point fixe</gray>
  <yellow>/manhunt players [add|remove <player> | mode off|allowlist|blocklist]</yellow> <gray>- qui est chassé</gray>
  <gold>Bots</gold>
  <yellow>/manhunt create <name> [amount] [difficulty] [skin <player>] [at <x y z>] [phase] [aggression]</yellow>
  <yellow>/manhunt remove <bot> · remove all confirm</yellow> <gray>- supprime des bots / efface tout</gray>
  <yellow>/manhunt list · info <bot> · tp <bot|all> [player]</yellow>
  <yellow>/manhunt skin <bot> <player> · spawnpoint <bot> [x y z | clear]</yellow>
  <yellow>/manhunt equip item <item> · equip armor <tier> · test <ability></yellow>
  <gold>Groupes</gold>
  <yellow>/manhunt group <group> role|enemy|spawnpoint|phases|chaseplayers|remove</yellow>
  <gold>Options</gold>
  <yellow>/manhunt settings [option] [value] · reload</yellow> <gray>- sans option, les affiche toutes</gray>

common:
  "yes": "oui"
  "no": "non"
  "on": "activé"
  "off": "désactivé"
  none: "aucun"
  automatic: "automatique"

difficulty:
  easy: "Facile"
  medium: "Moyen"
  hard: "Difficile"
  terminator: "Terminator"

role:
  hunter: "chasseur"
  escape: "fugitif"

# --- phases ---
phase:
  jump: "<red>[SAUT DE PHASE]</red> <white><bot></white> <gray>phase</gray> <yellow><from></yellow> <gray>→</gray> <gold><to></gold> <gray>(<reason> de <white><player></white>).</gray>"
  reason:
    nether: "est entré dans le Nether"
    diamonds: "5+ diamants dans l'inventaire"
    lots-of-iron: "plus de 20 de fer"
    iron: "du fer dans l'inventaire"
    wooden-weapon: "arme en bois"
  upgrade: "<dark_red><bold>[BOTS PLUS FORTS]</bold></dark_red> <gold>Phase <phase> atteinte !</gold>"
  description:
    "1": "<gray>Bot de base : sans équipement de phase ; il poursuit, creuse, fait des ponts et se débrouille.</gray>"
    "2": "<gray>Épée en bois et nourriture de base. Une arme en bois du joueur force cette phase.</gray>"
    "3": "<gray>Débloque l'arbalète et le seau d'eau contre le feu ; meilleure nourriture.</gray>"
    "4": "<gray>Armure en cuir, épée en pierre, bouclier, trident Loyauté, chevaux et rafales d'arc.</gray>"
    "5": "<gray>Armure et épée en fer, seau de lave et pommes dorées.</gray>"
    "6": "<gray>Fer avec Protection I, meilleurs butins et bateaux contre les cibles dans l'eau.</gray>"
    "7": "<gray>Épée en diamant, une partie de l'armure en diamant et des butins plus forts.</gray>"
    "8": "<gray>Diamant complet avec Protection II et épée Tranchant II.</gray>"
    "9": "<gray>Garde le diamant enchanté et le temps de recharge de la perle baisse de 50 %.</gray>"
    "10": "<gray>Garde le diamant enchanté et le temps de recharge de la perle baisse de 75 %.</gray>"
    "11": "<gray>Les bots sont devenus plus forts.</gray>"
    "12": "<dark_red>Phase finale (Terminator uniquement) : armure en netherite et épée en netherite avec Recul.</dark_red>"

# --- cercle et compte à rebours avant la chasse ---
countdown:
  ring-created: "<gold>Les chasseurs sont dans le cercle.</gold> <gray>Quand un joueur en sort, un compte à rebours de</gray> <yellow><seconds></yellow> <gray>secondes commence. Utilisez /manhunt start pour commencer tout de suite.</gray>"
  ring-created-no-countdown: "<gold>Les chasseurs sont dans le cercle.</gold> <gray>Quand un joueur en sort, la chasse commence. Utilisez /manhunt start pour commencer tout de suite.</gray>"
  bar-waiting: "<yellow>Sortez du cercle pour commencer</yellow> <gray>(<seconds>s d'avance)</gray>"
  bar-waiting-no-countdown: "<yellow>Sortez du cercle pour lancer la chasse</yellow>"
  left: "<yellow><player></yellow> <gold>est sorti du cercle !</gold>"
  left-and-counting: "<yellow><player></yellow> <gold>est sorti du cercle ! La chasse commence dans</gold> <yellow><seconds></yellow> <gold>secondes.</gold>"
  started: "<gold>La chasse commence dans <yellow><seconds></yellow> secondes !</gold> <gray>Utilisez /manhunt start pour commencer tout de suite.</gray>"
  bar: "<red>La chasse commence dans</red> <yellow><seconds>s</yellow>"
  title-number: "<red><bold><seconds></bold></red>"
  subtitle: "<gray>Préparez-vous...</gray>"
  begun-title: "<dark_red><bold>La chasse a commencé !</bold></dark_red>"
  begun-subtitle: "<gray>Courez.</gray>"
  begun: "<dark_red>La chasse a commencé !</dark_red>"
  nothing: "<gray>Aucun bot n'attend dans un cercle.</gray>"

ring:
  info: |-
    <gold>Cercle</gold> <gray>· rayon</gray> <white><radius></white> <gray>· centre</gray> <white><center></white> <gray>· point</gray> <white><point></white>
    <gray>Cercles en attente :</gray> <white><rings></white> <gray>(rayon : /manhunt settings ringradius <blocs|auto>)</gray>
  point-set: "<green>Point du cercle placé en <white><pos></white> (<white><world></white>). Les prochains cercles apparaissent ici (centre du cercle : manuel).</green>"
  point-cleared: "<green>Point du cercle effacé. Les cercles apparaissent de nouveau là où ils sont créés (centre du cercle : auto).</green>"
  no-point: "<yellow>Le centre du cercle est en manuel, mais aucun point n'est placé (ou son monde n'est pas chargé) : le cercle reste là où vous êtes. Placez-en un avec /manhunt ring point.</yellow>"

# --- qui est chassé : liste de joueurs et arrivées en cours de partie ---
player-list:
  info: "<gold>Liste de joueurs</gold> <gray>(<mode>) :</gray> <white><names></white>"
  empty: "personne"
  added: "<green><white><player></white> a été ajouté à la liste.</green>"
  already-listed: "<yellow><white><player></white> est déjà dans la liste.</yellow>"
  removed: "<green><white><player></white> a été retiré de la liste.</green>"
  not-listed: "<yellow><white><player></white> n'est pas dans la liste.</yellow>"
  off-warning: "<gray>La liste est désactivée : utilisez /manhunt players mode allowlist ou blocklist pour qu'elle compte.</gray>"
  mode: "<green>Liste de joueurs : <yellow><mode></yellow>.</green> <gray><explanation></gray>"
  explanation:
    "off": "Tout le monde peut être chassé et déclencher le cercle."
    allowlist: "Seuls les joueurs de la liste sont chassés et déclenchent le cercle."
    blocklist: "Les joueurs de la liste ne sont pas chassés et ne déclenchent pas le cercle."

hunt:
  joined-hunted: "<red>La chasse est en cours : vous êtes déjà une cible !</red>"
  joined-protected: "<gold>La chasse est en cours.</gold> <gray>Vous êtes protégé des chasseurs pendant</gray> <yellow><seconds></yellow> <gray>secondes.</gray>"
  joined-out: "<gray>La chasse est en cours. Vous ne serez pas chassé avant la prochaine.</gray>"
  protection-bar: "<green>Protégé des chasseurs :</green> <yellow><seconds>s</yellow>"
  protection-ended-bar: "<red>Votre protection est terminée !</red>"
  protection-ended: "<red>Votre protection est terminée : les chasseurs viennent pour vous !</red>"

# --- pause ---
pause:
  bar: "<yellow><bold>Chasse en pause</bold></yellow> <gray>· les bots sont figés</gray>"
  paused: "<yellow>Chasse en pause :</yellow> <gray>les bots sont figés et invincibles, et le compte à rebours, la protection et les phases sont arrêtés.</gray>"
  resumed: "<green>La chasse reprend !</green>"
  already-paused: "<gray>La chasse est déjà en pause. Utilisez /manhunt resume pour continuer.</gray>"
  not-paused: "<gray>La chasse n'est pas en pause.</gray>"
  state: "en pause"

