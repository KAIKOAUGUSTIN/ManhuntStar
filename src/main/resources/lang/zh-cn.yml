  enemy-added: "<green><white><group></white> 现在与 <white><enemy></white> 敌对。</green>"
  enemy-removed: "<green><white><group></white> 不再与 <white><enemy></white> 敌对。</green>"

settings:
  title: "<gold>Manhunt* 设置</gold> <gray>（/manhunt settings <option> <value>）</gray>"
