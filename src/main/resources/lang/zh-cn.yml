# ==============================================================================
#  Manhunt* - 简体中文
#  MiniMessage 格式：https://docs.advntr.dev/minimessage/format.html
#  <bot>、<phase>、<amount> 等标签由插件填写，翻译时请保留。
#  缺少的键会使用英文文本（en.yml）。默认文本变化时 "version" 会改变：旧文件会移到 lang/old/
#  并被新文件替换。
# ==============================================================================

version: 1

prefix: "<dark_red><bold>Manhunt*</bold></dark_red> <dark_gray>»</dark_gray> "

help: |-
  <dark_red><bold>Manhunt*</bold></dark_red> <gray>（ManHunt 猎人机器人）·</gray> <yellow>/manhunt menu</yellow> <gray>打开菜单</gray>
  <gold>对局</gold>
  <yellow>/manhunt start</yellow> <gray>- 释放所有圆圈并立即开始追猎</gray>
  <yellow>/manhunt pause · resume</yellow> <gray>- 冻结机器人和计时 / 继续</gray>
  <yellow>/manhunt target <player> · target clear</yellow> <gray>- 全部追一名玩家 / 恢复正常</gray>
  <yellow>/manhunt ring · ring point [x y z | clear]</yellow> <gray>- 圆圈及其固定点</gray>
  <yellow>/manhunt players [add|remove <player> | mode off|allowlist|blocklist]</yellow> <gray>- 谁会被追猎</gray>
  <gold>机器人</gold>
  <yellow>/manhunt create <name> [amount] [difficulty] [skin <player>] [at <x y z>] [phase] [aggression]</yellow>
  <yellow>/manhunt remove <bot> · remove all confirm</yellow> <gray>- 移除机器人 / 全部删除</gray>
  <yellow>/manhunt list · info <bot> · tp <bot|all> [player]</yellow>
  <yellow>/manhunt skin <bot> <player> · spawnpoint <bot> [x y z | clear]</yellow>
  <yellow>/manhunt equip item <item> · equip armor <tier> · test <ability></yellow>
  <gold>小组</gold>
  <yellow>/manhunt group <group> role|enemy|spawnpoint|phases|chaseplayers|remove</yellow>
  <gold>设置</gold>
  <yellow>/manhunt settings [option] [value] · reload</yellow> <gray>- 不带选项时显示全部</gray>

common:
  "yes": "是"
  "no": "否"
  "on": "开启"
  "off": "关闭"
  none: "无"
  automatic: "自动"

difficulty:
  easy: "简单"
  medium: "中等"
  hard: "困难"
  terminator: "终结者"

role:
  hunter: "猎人"
  escape: "逃亡者"

# --- 阶段 ---
phase:
  jump: "<red>[阶段跃升]</red> <white><bot></white> <gray>阶段</gray> <yellow><from></yellow> <gray>→</gray> <gold><to></gold> <gray>（<white><player></white>：<reason>）。</gray>"
  reason:
    nether: "进入了下界"
    diamonds: "背包里有 5 颗以上钻石"
    lots-of-iron: "超过 20 个铁"
    iron: "背包里有铁"
    wooden-weapon: "木制武器"
  upgrade: "<dark_red><bold>[机器人变强了]</bold></dark_red> <gold>已达到第 <phase> 阶段！</gold>"
  description:
    "1": "<gray>基础机器人：没有阶段装备；会追击、挖掘、搭桥并随机应变。</gray>"
    "2": "<gray>木剑和基础食物。玩家手持木制武器会强制进入此阶段。</gray>"
    "3": "<gray>解锁弩和防火用的水桶；食物更好。</gray>"
    "4": "<gray>皮革盔甲、石剑、盾牌、忠诚三叉戟、马和连射弓。</gray>"
    "5": "<gray>铁盔甲和铁剑、岩浆桶和金苹果。</gray>"
    "6": "<gray>带保护 I 的铁装备、更好的掉落物，以及对付水中目标的船。</gray>"
    "7": "<gray>钻石剑、部分钻石盔甲和更强的掉落物。</gray>"
    "8": "<gray>全套保护 II 钻石盔甲和锋利 II 的剑。</gray>"
    "9": "<gray>保留附魔钻石装备，末影珍珠冷却减少 50%。</gray>"
    "10": "<gray>保留附魔钻石装备，末影珍珠冷却减少 75%。</gray>"
    "11": "<gray>机器人变得更强了。</gray>"
    "12": "<dark_red>最终阶段（仅终结者）：下界合金盔甲和带击退的下界合金剑。</dark_red>"

# --- 追猎前的圆圈和倒计时 ---
countdown:
  ring-created: "<gold>猎人已在圆圈中。</gold> <gray>玩家离开圆圈后，开始</gray> <yellow><seconds></yellow> <gray>秒倒计时。使用 /manhunt start 立即开始。</gray>"
  ring-created-no-countdown: "<gold>猎人已在圆圈中。</gold> <gray>玩家离开圆圈后，追猎开始。使用 /manhunt start 立即开始。</gray>"
  bar-waiting: "<yellow>离开圆圈即可开始</yellow> <gray>（领先 <seconds> 秒）</gray>"
  bar-waiting-no-countdown: "<yellow>离开圆圈即可开始追猎</yellow>"
  left: "<yellow><player></yellow> <gold>离开了圆圈！</gold>"
  left-and-counting: "<yellow><player></yellow> <gold>离开了圆圈！追猎将在</gold> <yellow><seconds></yellow> <gold>秒后开始。</gold>"
  started: "<gold>追猎将在 <yellow><seconds></yellow> 秒后开始！</gold> <gray>使用 /manhunt start 立即开始。</gray>"
  bar: "<red>追猎开始倒计时</red> <yellow><seconds> 秒</yellow>"
  title-number: "<red><bold><seconds></bold></red>"
  subtitle: "<gray>准备好...</gray>"
  begun-title: "<dark_red><bold>追猎开始了！</bold></dark_red>"
  begun-subtitle: "<gray>快跑。</gray>"
  begun: "<dark_red>追猎开始了！</dark_red>"
  nothing: "<gray>没有机器人在圆圈中等待。</gray>"

ring:
  info: |-
    <gold>圆圈</gold> <gray>· 半径</gray> <white><radius></white> <gray>· 中心</gray> <white><center></white> <gray>· 固定点</gray> <white><point></white>
    <gray>当前等待的圆圈：</gray> <white><rings></white> <gray>（半径：/manhunt settings ringradius <方块数|auto>）</gray>
  point-set: "<green>圆圈固定点已设在 <white><pos></white>（<white><world></white>）。之后的圆圈会在这里生成（圆圈中心：manual）。</green>"
  point-cleared: "<green>圆圈固定点已清除。圆圈恢复在创建的位置生成（圆圈中心：auto）。</green>"
  no-point: "<yellow>圆圈中心为手动，但没有设置固定点（或其世界未加载）：圆圈会留在你所在的位置。请用 /manhunt ring point 设置。</yellow>"

# --- 谁会被追猎：玩家名单和中途加入者 ---
player-list:
  info: "<gold>玩家名单</gold> <gray>（<mode>）：</gray> <white><names></white>"
  empty: "无人"
  added: "<green><white><player></white> 已加入名单。</green>"
  already-listed: "<yellow><white><player></white> 已在名单中。</yellow>"
  removed: "<green><white><player></white> 已从名单移除。</green>"
  not-listed: "<yellow><white><player></white> 不在名单中。</yellow>"
  off-warning: "<gray>名单已关闭：使用 /manhunt players mode allowlist 或 blocklist 使其生效。</gray>"
  mode: "<green>玩家名单：<yellow><mode></yellow>。</green> <gray><explanation></gray>"
  explanation:
    "off": "所有人都可能被追猎并触发圆圈。"
    allowlist: "只有名单中的玩家会被追猎并触发圆圈。"
    blocklist: "名单中的玩家不会被追猎，也不会触发圆圈。"

hunt:
  joined-hunted: "<red>追猎正在进行：你已经是目标了！</red>"
  joined-protected: "<gold>追猎正在进行。</gold> <gray>你将受到保护，猎人</gray> <yellow><seconds></yellow> <gray>秒内不会追你。</gray>"
  joined-out: "<gray>追猎正在进行。下一轮之前你不会被追猎。</gray>"
  protection-bar: "<green>猎人保护中：</green> <yellow><seconds> 秒</yellow>"
  protection-ended-bar: "<red>你的保护结束了！</red>"
  protection-ended: "<red>你的保护结束了：猎人来找你了！</red>"

# --- 暂停 ---
pause:
  bar: "<yellow><bold>追猎已暂停</bold></yellow> <gray>· 机器人已冻结</gray>"
  paused: "<yellow>追猎已暂停：</yellow> <gray>机器人被冻结且无敌，倒计时、保护和阶段均已停止。</gray>"
  resumed: "<green>追猎继续！</green>"
  already-paused: "<gray>追猎已经暂停。使用 /manhunt resume 继续。</gray>"
  not-paused: "<gray>追猎没有暂停。</gray>"
  state: "已暂停"

# --- 命令 ---
command:
  creating: "<gray>正在创建</gray> <yellow><amount></yellow> <gray>个机器人</gray> <white><name></white> <gray>（<difficulty>）……正在获取皮肤。</gray>"
  created: "<green>已创建 <amount> 个机器人 <white><name></white>。</green>"
  create-error: "<red>无法创建机器人。请查看控制台。</red>"
  invalid-difficulty: "<red>难度无效。请使用 easy、medium、hard 或 terminator。</red>"
  no-location: "<red>此命令需要一个位置（请在游戏中使用或提供坐标）。</red>"
  removed: "<yellow>已移除 <amount> 个名为 <white><name></white> 的机器人。</yellow>"
  all-removed: "<yellow>已永久删除 <amount> 个机器人。</yellow>"
  confirm-remove-all: "<red>这会删除所有机器人和存档。输入 <white>/manhunt remove all confirm</white> 确认。</red>"
  list-title: "<gold>机器人：<yellow><amount></yellow>（<green>存活 <alive></green>）</gold>"
  list-line: "<gray>-</gray> <white><display-name></white> <dark_gray>(<name>)</dark_gray> <gray>阶段</gray> <yellow><phase></yellow> <gray><difficulty> · 生命</gray> <red><health></red> <gray>· 小组</gray> <aqua><group></aqua> <gray>· 目标</gray> <white><target></white> <gray>· <location> · 击杀</gray> <yellow><kills></yellow> <dark_gray>[<state>]</dark_gray>"
  list-dead: "已死亡（重生中）"
  info: |-
    <gold><display-name></gold> <dark_gray>(<name>)</dark_gray>
    <gray>存活：<white><alive></white> · 阶段 <yellow><phase></yellow> · <difficulty></gray>
    <gray>生命 <red><health></red> · 饥饿 <white><hunger></white> · 击杀 <yellow><kills></yellow> · 攻击性 <white><aggression></white></gray>
    <gray>小组 <aqua><group></aqua> · 目标 <white><target></white></gray>
    <gray>位置 <white><location></white> · 速度 <white><speed></white> 方块/秒 · 着地 <white><on-ground></white></gray>
    <gray>AI：<yellow><state></yellow></gray>
  bot-not-found: "<red>找不到机器人。</red>"
  players-only: "<red>只有玩家可以使用此功能。</red>"
  target-set: "<green>所有机器人现在都在追 <white><player></white>。</green>"
  target-cleared: "<green>已移除强制目标：机器人重新自行选择。</green>"
  item-given: "<green>已把物品 <white><item></white> 给予所有机器人。</green>"
  invalid-tier: "<red>未知的盔甲类型：<white><tier></white>。请使用 leather、chainmail、iron、gold、diamond 或 netherite。</red>"
  armor: "<green>已为所有机器人穿上 <white><tier></white> 盔甲。</green>"
  tp-one: "<green><white><bot></white> 已前往 <white><player></white>。</green>"
  tp-all: "<green>已把 <amount> 个机器人带到 <white><player></white> 身边。</green>"
  spawnpoint-bot: "<green><white><bot></white> 的重生点已设在 <white><pos></white>。</green>"
  spawnpoint-bot-cleared: "<green>已移除 <white><bot></white> 的重生点。</green>"
  skin-ok: "<green>已把 <white><player></white> 的皮肤应用到 <white><bot></white>。</green>"
  skin-failed: "<red>找不到 <white><player></white> 的皮肤。</red>"
  reloaded: "<green>已重新加载 config.yml 和语言文件（语言：<white><language></white>）。</green>"

ability:
  started: "<green>能力 <white><ability></white> 已启动。</green>"
  must-be-alive: "<red>你必须活着。</red>"
  already-active: "<red>已有一个能力正在针对你。</red>"
