    "off": "На всех можно охотиться, и все запускают круг."
    allowlist: "Охотятся только на игроков из списка, и только они запускают круг."
    blocklist: "На игроков из списка не охотятся, и они не запускают круг."

hunt:
  joined-hunted: "<red>Охота идёт: вы уже цель!</red>"
  joined-protected: "<gold>Охота идёт.</gold> <gray>Вы защищены от охотников на</gray> <yellow><seconds></yellow> <gray>с.</gray>"
  joined-out: "<gray>Охота идёт. На вас не будут охотиться до следующей.</gray>"
  protection-bar: "<green>Защита от охотников:</green> <yellow><seconds> с</yellow>"
  protection-ended-bar: "<red>Ваша защита закончилась!</red>"
  protection-ended: "<red>Ваша защита закончилась: охотники идут за вами!</red>"

