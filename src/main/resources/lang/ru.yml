  allowspear:
    name: "Копьё верхом"
    description: "Копьё верхом (фаза 4+): верхом бот атакует цель копьём своей фазы, проносится мимо, разворачивается и атакует снова. Пешком он использует меч."
  projinaccuracy:
    name: "Неточность стрел и трезубца"
    description: "Множитель неточности стрел/трезубцев."
  humanize:
    name: "Очеловечивание"
    description: "Очеловечивание (от 0 до 1): ошибки прицела, промахи и неровный ритм."
  meleemisschance:
    name: "Шанс промаха"
    description: "Шанс промахнуться ударом (умножается на очеловечивание)."
  meleedelayjitter:
    name: "Случайная пауза между ударами"
    description: "Случайная пауза между ударами, в тиках."
  meleereachvariance:
    name: "Разброс дальности"
    description: "Насколько может меняться дальность удара."
  meleeaimoffset:
    name: "Смещение прицела при ударе"
    description: "Смещение прицела при ударах."
  meleespamvariance:
    name: "Разброс ритма ударов"
    description: "Разброс ритма ударов."
  allowtowering:
    name: "Башни и мосты"
    description: "Башни и мосты рядом с целью (до 3 блоков по горизонтали)."
  allowpearl:
    name: "Жемчуг Края"
    description: "Жемчуг Края."
  pearlcooldownmult:
    name: "Перезарядка жемчуга"
    description: "Множитель перезарядки жемчуга."
  pearldimension:
    name: "Где использовать жемчуг"
    description: "Где боты бросают жемчуг: nether, both (оба), overworld."
  allowhorse:
    name: "Лошади"
    description: "Лошади (фаза 4+)."
  allowboat:
    name: "Лодки"
    description: "Лодки: преследовать того, кто в лодке или плывёт, и переплывать озёра на лодке, когда это быстрее, чем обходить."
  allowelytra:
    name: "Элитры"
    description: "Элитры, чтобы догонять далёкие цели."
  allowredistribution:
    name: "Возвращать далёких ботов"
    description: "Боты, слишком далёкие от цели, появляются скрытно рядом с ней."
  redistdistance:
    name: "Расстояние для возврата ботов"
    description: "Расстояние (в блоках), начиная с которого бот перераспределяется."
  minnetherdelay:
    name: "Мин. задержка смены измерения (с)"
    description: "Минимальное время, через которое боты последуют за целью в другое измерение."
  maxnetherdelay:
    name: "Макс. задержка смены измерения (с)"
    description: "Максимальное время, через которое боты последуют за целью в другое измерение."
  pathmode:
    name: "Планировщик пути"
    description: "Планировщик: ASTAR или DUMB."
  pathgreediness:
    name: "Жадность A*"
    description: "Жадность A* (больше = быстрее, но пути хуже)."
  pathnodes:
    name: "Лимит узлов A*"
    description: "Лимит узлов A*."
  pathdynamicnodes:
    name: "Автоматический лимит узлов"
    description: "Сам подстраивает лимит узлов под время расчёта."
  pathfallback:
    name: "Идти напрямую без пути"
    description: "Если пути нет, идти прямо к цели."
  pathasync:
    name: "Считать пути параллельно"
    description: "Считает пути вне основного потока."
  pathdebug:
    name: "Путь частицами"
    description: "Показывает путь частицами тем, у кого есть manhuntstar.admin."
  caveambush:
    name: "Засада в пещере"
    description: "Засада в пещере с кроватью (бот возрождается у кровати)."
  caveambushcooldown:
    name: "Интервал между засадами (с)"
    description: "Секунды между тем, как один бот и следующий идут в засаду (1 = как в моде)."
  autocapacities:
    name: "Автоматические TNT и фейерверки"
    description: "Автоматическая засада с TNT и арбалет с фейерверками (в моде были заблокированы)."
  fireworkcrossbow:
    name: "Арбалет с фейерверками"
    description: "Арбалет с фейерверками (экспериментально в моде). Бот стреляет, только когда игрок в зоне досягаемости (около 64 блоков, без блоков на пути)."
  bowpressure:
    name: "Залп из лука"
    description: "Залп из лука, когда бот слишком долго не попадает по игроку. Он стреляет, только если стрела долетит до игрока."
  silentdeaths:
    name: "Тихие смерти"
    description: "Самый далёкий от каждого игрока бот (200+ блоков) исчезает и возрождается ближе."
  portalentrance:
    name: "Прибытие через портал"
    description: "Боты прибывают в другое измерение через портал, который видит игрок."
  spawnmode:
    name: "Режим появления"
    description: "NORMAL: появляется в точке. MANHUNT: появляется в круге и ждёт начала охоты."
  countdown:
    name: "Отсчёт до охоты (с)"
    description: "Отсчёт (секунды) до начала охоты. 0 = боты отпускаются, как только кто-то выйдет из круга."
  countdownonleave:
    name: "Отсчёт только после выхода из круга"
    description: "Отсчёт начинается, только когда игрок, бывший внутри круга, выходит из него; до этого боты ждут. Выкл. = отсчёт начинается сразу после создания ботов."
  countdowninvulnerable:
    name: "Неуязвимые боты в круге"
    description: "Боты в круге не получают урон, пока ждут и во время отсчёта."
  ringradius:
    name: "Радиус круга (0 = авто)"
    description: "Радиус круга в блоках. 0 = автоматически (5 блоков + 1 на каждые 5 ботов)."
  ringcenter:
    name: "Центр круга"
    description: "auto = круг остаётся там, где создан; manual = в точке, заданной через /manhunt ring point."
  latejoin:
    name: "Опоздавшие игроки"
    description: "Кто заходит во время охоты: hunted = сразу становится целью; protected = не цель на время отсчёта (минимум 5 с); out = на него не охотятся до следующей охоты."
  playerlistmode:
    name: "Список игроков"
    description: "off = на всех можно охотиться; allowlist = охотятся только на игроков из списка, и только они запускают круг; blocklist = на игроков из списка не охотятся, и они не запускают круг."
  glowhunters:
    name: "Свечение охотников"
    description: "Свечение (контур, видимый сквозь стены) на охотниках."
  glowhunterscolor:
    name: "Цвет свечения охотников"
    description: "Цвет свечения охотников."
  glowescapers:
    name: "Свечение беглецов"
    description: "Свечение на ботах групп беглецов."
  glowescaperscolor:
    name: "Цвет свечения беглецов"
    description: "Цвет свечения беглецов."
  nametag:
    name: "Имя над ботом"
    description: "Имя видно над ботом."

