  info: "<gold>Список игроков</gold> <gray>(<mode>):</gray> <white><names></white>"
  empty: "никого"
  added: "<green><white><player></white> добавлен в список.</green>"
  already-listed: "<yellow><white><player></white> уже в списке.</yellow>"
  removed: "<green><white><player></white> убран из списка.</green>"
  not-listed: "<yellow><white><player></white> нет в списке.</yellow>"
