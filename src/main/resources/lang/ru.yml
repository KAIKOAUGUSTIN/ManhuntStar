# ==============================================================================
#  Manhunt* - Русский
#  Формат MiniMessage: https://docs.advntr.dev/minimessage/format.html
#  Теги вроде <bot>, <phase> и <amount> заполняет плагин; при переводе их нужно сохранить.
#  Отсутствующие ключи берутся из английского текста (en.yml). «version» меняется, когда меняются
#  тексты по умолчанию: более старый файл переносится в lang/old/ и заменяется новым.
# ==============================================================================

version: 1

prefix: "<dark_red><bold>Manhunt*</bold></dark_red> <dark_gray>»</dark_gray> "

help: |-
  <dark_red><bold>Manhunt*</bold></dark_red> <gray>(боты-охотники для ManHunt) ·</gray> <yellow>/manhunt menu</yellow> <gray>открывает меню</gray>
  <gold>Матч</gold>
  <yellow>/manhunt start</yellow> <gray>- отпускает круги и сразу начинает охоту</gray>
  <yellow>/manhunt pause · resume</yellow> <gray>- замораживает ботов и таймеры / продолжает</gray>
  <yellow>/manhunt target <player> · target clear</yellow> <gray>- все за одним игроком / обычный режим</gray>
  <yellow>/manhunt ring · ring point [x y z | clear]</yellow> <gray>- круг и его фиксированная точка</gray>
  <yellow>/manhunt players [add|remove <player> | mode off|allowlist|blocklist]</yellow> <gray>- на кого охотятся</gray>
  <gold>Боты</gold>
  <yellow>/manhunt create <name> [amount] [difficulty] [skin <player>] [at <x y z>] [phase] [aggression]</yellow>
  <yellow>/manhunt remove <bot> · remove all confirm</yellow> <gray>- удаляет ботов / стирает всё</gray>
  <yellow>/manhunt list · info <bot> · tp <bot|all> [player]</yellow>
  <yellow>/manhunt skin <bot> <player> · spawnpoint <bot> [x y z | clear]</yellow>
  <yellow>/manhunt equip item <item> · equip armor <tier> · test <ability></yellow>
  <gold>Группы</gold>
  <yellow>/manhunt group <group> role|enemy|spawnpoint|phases|chaseplayers|remove</yellow>
  <gold>Настройки</gold>
  <yellow>/manhunt settings [option] [value] · reload</yellow> <gray>- без опции показывает все</gray>

common:
  "yes": "да"
  "no": "нет"
  "on": "вкл."
  "off": "выкл."
  none: "нет"
  automatic: "автоматически"

difficulty:
  easy: "Лёгкая"
  medium: "Средняя"
  hard: "Сложная"
  terminator: "Терминатор"

role:
  hunter: "охотник"
  escape: "беглец"

# --- фазы ---
phase:
  jump: "<red>[СКАЧОК ФАЗЫ]</red> <white><bot></white> <gray>фаза</gray> <yellow><from></yellow> <gray>→</gray> <gold><to></gold> <gray>(<reason>: <white><player></white>).</gray>"
  reason:
    nether: "вошёл в Незер"
    diamonds: "5+ алмазов в инвентаре"
    lots-of-iron: "больше 20 железа"
    iron: "железо в инвентаре"
    wooden-weapon: "деревянное оружие"
  upgrade: "<dark_red><bold>[БОТЫ СИЛЬНЕЕ]</bold></dark_red> <gold>Достигнута фаза <phase>!</gold>"
  description:
    "1": "<gray>Базовый бот: без снаряжения фазы; преследует, копает, строит мосты и выкручивается.</gray>"
    "2": "<gray>Деревянный меч и простая еда. Деревянное оружие игрока включает эту фазу.</gray>"
    "3": "<gray>Открываются арбалет и ведро воды против огня; еда лучше.</gray>"
    "4": "<gray>Кожаная броня, каменный меч, щит, трезубец с Верностью, лошади и залпы из лука.</gray>"
    "5": "<gray>Железные броня и меч, ведро лавы и золотые яблоки.</gray>"
    "6": "<gray>Железо с Защитой I, лучшая добыча и лодки против целей в воде.</gray>"
    "7": "<gray>Алмазный меч, часть алмазной брони и более сильная добыча.</gray>"
    "8": "<gray>Полный алмаз с Защитой II и меч с Остротой II.</gray>"
    "9": "<gray>Сохраняет зачарованный алмаз, перезарядка жемчуга меньше на 50%.</gray>"
    "10": "<gray>Сохраняет зачарованный алмаз, перезарядка жемчуга меньше на 75%.</gray>"
    "11": "<gray>Боты стали сильнее.</gray>"
    "12": "<dark_red>Последняя фаза (только Терминатор): незеритовая броня и незеритовый меч с Отдачей.</dark_red>"

# --- круг и отсчёт перед охотой ---
countdown:
  ring-created: "<gold>Охотники в круге.</gold> <gray>Когда игрок выйдет из него, начнётся отсчёт</gray> <yellow><seconds></yellow> <gray>секунд. /manhunt start начинает сразу.</gray>"
  ring-created-no-countdown: "<gold>Охотники в круге.</gold> <gray>Когда игрок выйдет из него, начнётся охота. /manhunt start начинает сразу.</gray>"
  bar-waiting: "<yellow>Выйдите из круга, чтобы начать</yellow> <gray>(<seconds> с форы)</gray>"
  bar-waiting-no-countdown: "<yellow>Выйдите из круга, чтобы начать охоту</yellow>"
  left: "<yellow><player></yellow> <gold>вышел из круга!</gold>"
  left-and-counting: "<yellow><player></yellow> <gold>вышел из круга! Охота начнётся через</gold> <yellow><seconds></yellow> <gold>с.</gold>"
  started: "<gold>Охота начнётся через <yellow><seconds></yellow> с!</gold> <gray>/manhunt start начинает сразу.</gray>"
  bar: "<red>Охота начнётся через</red> <yellow><seconds> с</yellow>"
  title-number: "<red><bold><seconds></bold></red>"
  subtitle: "<gray>Приготовьтесь...</gray>"
  begun-title: "<dark_red><bold>Охота началась!</bold></dark_red>"
  begun-subtitle: "<gray>Бегите.</gray>"
  begun: "<dark_red>Охота началась!</dark_red>"
  nothing: "<gray>В кругах нет ждущих ботов.</gray>"

ring:
  info: |-
    <gold>Круг</gold> <gray>· радиус</gray> <white><radius></white> <gray>· центр</gray> <white><center></white> <gray>· точка</gray> <white><point></white>
    <gray>Ждущих кругов сейчас:</gray> <white><rings></white> <gray>(радиус: /manhunt settings ringradius <блоки|auto>)</gray>
  point-set: "<green>Точка круга установлена в <white><pos></white> (<white><world></white>). Следующие круги появятся здесь (центр круга: manual).</green>"
  point-cleared: "<green>Точка круга удалена. Круги снова появляются там, где их создают (центр круга: auto).</green>"
  no-point: "<yellow>Центр круга задан вручную, но точка не установлена (или её мир не загружен): круг останется там, где вы. Установите её через /manhunt ring point.</yellow>"

# --- на кого охотятся: список игроков и опоздавшие ---
