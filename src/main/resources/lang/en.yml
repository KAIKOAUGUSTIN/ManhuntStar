# --- name and description of each option in the menu (the key is the /manhunt settings key) ---
options:
  language:
    name: "Language"
    description: "Language of the messages and the menu: a file from the lang/ folder. Missing texts fall back to English."
  tablist:
    name: "Bots in the TAB list"
    description: "Bots show up in the TAB list as players (with skin and ping)."
  joinmessages:
    name: "Join and leave messages"
    description: "\"X joined the game\" / \"X left the game\" when a bot is created or removed."
  deathmessages:
    name: "Death messages"
    description: "Bot death messages in the vanilla format (follows the death messages gamerule)."
  serverlistcount:
    name: "Count in the server list"
    description: "Bots count towards the online players and the names in the server list."
  listcommand:
    name: "Bots in /list"
    description: "/list includes the bots (same format as vanilla)."
  respectpvp:
    name: "Respect disabled PvP"
    description: "With pvp off in the world, bots don't hit players."
  mineskin:
    name: "MineSkin fallback skin"
    description: "With no skin for the chosen name, use the first .png in the skins/ folder (or the mod's robot), uploaded once to MineSkin to get a signature."
  bothealth:
    name: "Max health"
    description: "Bot max health."
  botinvincible:
    name: "Invincible bots"
    description: "Bots take no damage (only from the void and /kill)."
  respawn:
    name: "Respawn after dying"
    description: "Bots respawn 5 s after dying."
  persistentbots:
    name: "Keep bots on restart"
    description: "Bots keep existing after a server restart (bots.yml)."
  dropinventory:
    name: "Drop inventory on death"
    description: "Bots drop their inventory when they die."
  gearpersistence:
    name: "Gear on death"
    description: "What happens to the best sword/pickaxe/armor when the bot dies: keep it, keep it and drop a copy, or drop it and lose it."
  phasemultiplier:
    name: "Phase duration"
    description: "Multiplies the length of each progression phase."
  defaultdifficulty:
    name: "Default difficulty"
    description: "Difficulty used when the command doesn't give one: easy, medium, hard, terminator."
  autoeat:
    name: "Eat on their own"
    description: "Bots eat when they get hungry."
  autogapple:
    name: "Golden apples in combat"
    description: "Bots eat golden apples in combat (phase 5+)."
  firewaterescape:
    name: "Put out fire with water"
    description: "Bots put out fire with a water bucket (phase 3+)."
  mobsattackbots:
    name: "Mobs attack the bots"
    description: "Hostile mobs attack the bots like they attack players."
  aimsmoothness:
    name: "Aim smoothing (ms)"
    description: "Aim smoothing in milliseconds (0 = instant, the mod's default)."
  targetpriority:
    name: "Player × mob priority"
    description: "Preference between players and mobs: 5 = players only, -5 = mobs only."
  targetmode:
    name: "Target split"
    description: "How the bots split the players: closest, equal, farthest."
  allowtrident:
    name: "Trident"
    description: "Trident (phase 4+)."
  allowcrossbow:
    name: "Crossbow"
    description: "Crossbow (phase 3+)."
  allowspear:
    name: "Mounted spear"
    description: "Mounted spear (phase 4+): on horseback the bot charges the target with the phase's spear, rides past, turns around and charges again. On foot it uses the sword."
  projinaccuracy:
    name: "Arrow and trident inaccuracy"
    description: "Inaccuracy multiplier for arrows/tridents."
  humanize:
    name: "Humanization"
    description: "Humanization (0 to 1): aim mistakes, missed hits and an irregular rhythm."
  meleemisschance:
    name: "Hit miss chance"
    description: "Chance to miss a hit (multiplied by the humanization)."
  meleedelayjitter:
    name: "Random delay between hits"
    description: "Random delay between hits, in ticks."
  meleereachvariance:
    name: "Reach variation"
    description: "How much the hit reach can vary."
  meleeaimoffset:
    name: "Hit aim offset"
    description: "Aim offset on hits."
  meleespamvariance:
    name: "Hit rhythm variation"
    description: "Variation in the hit rhythm."
  allowtowering:
    name: "Towers and bridges"
    description: "Towers and bridges near the target (up to 3 blocks horizontally)."
  allowpearl:
    name: "Ender pearls"
    description: "Ender pearls."
  pearlcooldownmult:
    name: "Ender pearl cooldown"
    description: "Ender pearl cooldown multiplier."
  pearldimension:
    name: "Where to use ender pearls"
    description: "Where the bots use ender pearls: nether, both, overworld."
  allowhorse:
    name: "Horses"
    description: "Horses (phase 4+)."
  allowboat:
    name: "Boats"
    description: "Boats: chase whoever is in a boat or swimming, and cross lakes by boat when it beats walking around."
  allowelytra:
    name: "Elytra"
    description: "Elytra to reach far targets."
  allowredistribution:
    name: "Bring back far bots"
    description: "Bots very far from the target reappear hidden near it."
  redistdistance:
    name: "Distance to bring bots back"
    description: "Distance (blocks) from which a bot gets redistributed."
  minnetherdelay:
    name: "Min delay to change dimension (s)"
    description: "Minimum time until the bots follow the target to another dimension."
  maxnetherdelay:
    name: "Max delay to change dimension (s)"
    description: "Maximum time until the bots follow the target to another dimension."
  pathmode:
    name: "Path planner"
    description: "Planner: ASTAR or DUMB."
  pathgreediness:
    name: "A* greediness"
    description: "A* greediness (higher = faster, worse paths)."
  pathnodes:
    name: "A* node limit"
    description: "A* node limit."
  pathdynamicnodes:
    name: "Automatic node limit"
    description: "Adjusts the node limit by itself based on the computation time."
  pathfallback:
    name: "Walk straight without a path"
    description: "With no path, walk straight to the target."
  pathasync:
    name: "Compute paths in parallel"
    description: "Computes paths off the main thread."
  pathdebug:
    name: "Path as particles"
    description: "Shows the path as particles to whoever has manhuntstar.admin."
  caveambush:
    name: "Cave ambush"
    description: "Cave ambush with a bed (the bot respawns near the bed)."
  caveambushcooldown:
    name: "Time between ambushes (s)"
    description: "Seconds between one bot and the next going for the ambush (1 = like the mod)."
  autocapacities:
    name: "Automatic TNT and fireworks"
    description: "Automatic TNT ambush and firework crossbow (locked in the mod)."
  fireworkcrossbow:
    name: "Firework crossbow"
    description: "Firework crossbow (experimental in the mod). The bot only shoots with the player in range (about 64 blocks, no block in the way)."
  bowpressure:
    name: "Bow burst"
    description: "Bow burst when the bot goes too long without hitting the player. It only shoots if the arrow reaches the player."
  silentdeaths:
    name: "Silent deaths"
    description: "The bot farthest from each player (200+ blocks) vanishes and respawns closer."
  portalentrance:
    name: "Arrive through a portal"
    description: "Bots arrive in another dimension through a portal the player can see."
  spawnmode:
    name: "Spawn mode"
    description: "NORMAL: spawns at the point. MANHUNT: spawns in a ring and waits for the hunt to start."
  countdown:
    name: "Countdown before the hunt (s)"
    description: "Countdown (seconds) before the hunt starts. 0 = released as soon as someone leaves the ring."
  countdownonleave:
    name: "Count only after leaving the ring"
    description: "The countdown only starts when a player who was inside the ring leaves it; until then the bots wait. Off = the countdown starts as soon as the bots are created."
  countdowninvulnerable:
    name: "Invulnerable bots in the ring"
    description: "Ring bots take no damage while waiting and during the countdown."
  ringradius:
    name: "Ring radius (0 = automatic)"
    description: "Ring radius in blocks. 0 = automatic (5 blocks + 1 every 5 bots)."
  ringcenter:
    name: "Ring center"
    description: "auto = the ring stays where it's created; manual = at the point set with /manhunt ring point."
  latejoin:
    name: "Late joiners"
    description: "Who joins while the hunt is running: hunted = a target right away; protected = not a target for the countdown time (at least 5 s); out = not hunted until the next hunt."
  playerlistmode:
    name: "Player list"
    description: "off = everyone can be hunted; allowlist = only the listed players are hunted and trigger the ring; blocklist = the listed players aren't hunted and don't trigger the ring."
  glowhunters:
    name: "Glow on the hunters"
    description: "Glow (outline visible through walls) on the hunters."
  glowhunterscolor:
    name: "Hunters' glow color"
    description: "Hunters' glow color."
  glowescapers:
    name: "Glow on the escapers"
    description: "Glow on the bots of escape groups."
  glowescaperscolor:
    name: "Escapers' glow color"
    description: "Escapers' glow color."
  nametag:
    name: "Name above the bot"
    description: "Name visible above the bot."

