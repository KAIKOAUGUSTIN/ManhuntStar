# ==============================================================================
#  Manhunt* - English (default language)
#  MiniMessage format: https://docs.advntr.dev/minimessage/format.html
#  Tags such as <bot>, <phase> and <amount> are filled in by the plugin; keep them when translating.
#  Missing keys fall back to this file. "version" changes when the default texts change: an older
#  file is moved to lang/old/ and replaced with the new one.
# ==============================================================================

version: 1

prefix: "<dark_red><bold>Manhunt*</bold></dark_red> <dark_gray>»</dark_gray> "

help: |-
  <dark_red><bold>Manhunt*</bold></dark_red> <gray>(ManHunt hunter bots) ·</gray> <yellow>/manhunt menu</yellow> <gray>opens the menu</gray>
  <gold>Match</gold>
  <yellow>/manhunt start</yellow> <gray>- releases the rings and starts the hunt now</gray>
  <yellow>/manhunt pause · resume</yellow> <gray>- freezes the bots and the clocks / continues</gray>
  <yellow>/manhunt target <player> · target clear</yellow> <gray>- every bot after one player / back to normal</gray>
  <yellow>/manhunt ring · ring point [x y z | clear]</yellow> <gray>- the ring and its fixed point</gray>
  <yellow>/manhunt players [add|remove <player> | mode off|allowlist|blocklist]</yellow> <gray>- who gets hunted</gray>
  <gold>Bots</gold>
  <yellow>/manhunt create <name> [amount] [difficulty] [skin <player>] [at <x y z>] [phase] [aggression]</yellow>
  <yellow>/manhunt remove <bot> · remove all confirm</yellow> <gray>- removes bots / deletes everything</gray>
  <yellow>/manhunt list · info <bot> · tp <bot|all> [player]</yellow>
  <yellow>/manhunt skin <bot> <player> · spawnpoint <bot> [x y z | clear]</yellow>
  <yellow>/manhunt equip item <item> · equip armor <tier> · test <ability></yellow>
  <gold>Groups</gold>
  <yellow>/manhunt group <group> role|enemy|spawnpoint|phases|chaseplayers|remove</yellow>
  <gold>Settings</gold>
  <yellow>/manhunt settings [option] [value] · reload</yellow> <gray>- with no option, shows them all</gray>

common:
  "yes": "yes"
  "no": "no"
  "on": "on"
  "off": "off"
  none: "none"
  automatic: "automatic"

difficulty:
  easy: "Easy"
  medium: "Medium"
  hard: "Hard"
  terminator: "Terminator"

role:
  hunter: "hunter"
  escape: "escaper"

# --- phases ---
phase:
  jump: "<red>[PHASE JUMP]</red> <white><bot></white> <gray>phase</gray> <yellow><from></yellow> <gray>→</gray> <gold><to></gold> <gray>(<reason> of <white><player></white>).</gray>"
  reason:
    nether: "entered the Nether"
    diamonds: "5+ diamonds in the inventory"
    lots-of-iron: "more than 20 iron"
    iron: "iron in the inventory"
    wooden-weapon: "wooden weapon"
  upgrade: "<dark_red><bold>[STRONGER BOTS]</bold></dark_red> <gold>Phase <phase> reached!</gold>"
  description:
    "1": "<gray>Basic bot: no phase gear; chases, digs, bridges and gets by.</gray>"
    "2": "<gray>Wooden sword and basic food. A player's wooden weapon forces this phase.</gray>"
    "3": "<gray>Unlocks the crossbow and the water bucket against fire; better food.</gray>"
    "4": "<gray>Leather armor, stone sword, shield, loyalty trident, horses and bow bursts.</gray>"
    "5": "<gray>Iron armor and sword, lava bucket and golden apples.</gray>"
    "6": "<gray>Iron with Protection I, better drops and boats against targets in the water.</gray>"
    "7": "<gray>Diamond sword, part of the diamond armor and stronger drops.</gray>"
    "8": "<gray>Full diamond with Protection II and a Sharpness II sword.</gray>"
    "9": "<gray>Keeps the enchanted diamond and the ender pearl cooldown drops by 50%.</gray>"
    "10": "<gray>Keeps the enchanted diamond and the ender pearl cooldown drops by 75%.</gray>"
    "11": "<gray>The bots got stronger.</gray>"
    "12": "<dark_red>Final phase (Terminator only): netherite armor and a netherite sword with Knockback.</dark_red>"

# --- ring and countdown before the hunt ---
countdown:
  ring-created: "<gold>The hunters are in the ring.</gold> <gray>When a player leaves it, a</gray> <yellow><seconds></yellow> <gray>second countdown starts. Use /manhunt start to start now.</gray>"
  ring-created-no-countdown: "<gold>The hunters are in the ring.</gold> <gray>When a player leaves it, the hunt starts. Use /manhunt start to start now.</gray>"
  bar-waiting: "<yellow>Leave the ring to start</yellow> <gray>(<seconds>s head start)</gray>"
  bar-waiting-no-countdown: "<yellow>Leave the ring to start the hunt</yellow>"
  left: "<yellow><player></yellow> <gold>left the ring!</gold>"
  left-and-counting: "<yellow><player></yellow> <gold>left the ring! The hunt starts in</gold> <yellow><seconds></yellow> <gold>seconds.</gold>"
  started: "<gold>The hunt starts in <yellow><seconds></yellow> seconds!</gold> <gray>Use /manhunt start to start now.</gray>"
  bar: "<red>The hunt starts in</red> <yellow><seconds>s</yellow>"
  title-number: "<red><bold><seconds></bold></red>"
  subtitle: "<gray>Get ready...</gray>"
  begun-title: "<dark_red><bold>The hunt has begun!</bold></dark_red>"
  begun-subtitle: "<gray>Run.</gray>"
  begun: "<dark_red>The hunt has begun!</dark_red>"
  nothing: "<gray>No bots are waiting in a ring.</gray>"

ring:
  info: |-
    <gold>Ring</gold> <gray>· radius</gray> <white><radius></white> <gray>· center</gray> <white><center></white> <gray>· point</gray> <white><point></white>
    <gray>Rings waiting now:</gray> <white><rings></white> <gray>(radius: /manhunt settings ringradius <blocks|auto>)</gray>
  point-set: "<green>Ring point set at <white><pos></white> (<white><world></white>). The next rings spawn here (ring center: manual).</green>"
  point-cleared: "<green>Ring point cleared. Rings spawn where they're created again (ring center: auto).</green>"
  no-point: "<yellow>The ring center is manual, but there's no point set (or its world isn't loaded): the ring stays where you are. Set one with /manhunt ring point.</yellow>"

# --- who gets hunted: player list and late joiners ---
player-list:
  info: "<gold>Player list</gold> <gray>(<mode>):</gray> <white><names></white>"
  empty: "nobody"
  added: "<green><white><player></white> was added to the list.</green>"
  already-listed: "<yellow><white><player></white> is already on the list.</yellow>"
  removed: "<green><white><player></white> was removed from the list.</green>"
  not-listed: "<yellow><white><player></white> isn't on the list.</yellow>"
  off-warning: "<gray>The list is off: use /manhunt players mode allowlist or blocklist to make it count.</gray>"
  mode: "<green>Player list: <yellow><mode></yellow>.</green> <gray><explanation></gray>"
  explanation:
    "off": "Everyone can be hunted and trigger the ring."
    allowlist: "Only the listed players are hunted and trigger the ring."
    blocklist: "The listed players aren't hunted and don't trigger the ring."

hunt:
  joined-hunted: "<red>The hunt is on: you're already a target!</red>"
  joined-protected: "<gold>The hunt is on.</gold> <gray>You're protected from the hunters for</gray> <yellow><seconds></yellow> <gray>seconds.</gray>"
  joined-out: "<gray>The hunt is on. You won't be hunted until the next one.</gray>"
  protection-bar: "<green>Protected from the hunters:</green> <yellow><seconds>s</yellow>"
  protection-ended-bar: "<red>Your protection is over!</red>"
  protection-ended: "<red>Your protection is over: the hunters are coming for you now!</red>"

# --- pause ---
pause:
  bar: "<yellow><bold>Hunt paused</bold></yellow> <gray>· the bots are frozen</gray>"
  paused: "<yellow>Hunt paused:</yellow> <gray>the bots are frozen and invincible, and the countdown, protection and phases are stopped.</gray>"
  resumed: "<green>The hunt goes on!</green>"
  already-paused: "<gray>The hunt is already paused. Use /manhunt resume to continue.</gray>"
  not-paused: "<gray>The hunt isn't paused.</gray>"
  state: "paused"

# --- commands ---
command:
  creating: "<gray>Creating</gray> <yellow><amount></yellow> <gray>bot(s)</gray> <white><name></white> <gray>(<difficulty>)... fetching the skin.</gray>"
  created: "<green><amount> bot(s) <white><name></white> created.</green>"
  create-error: "<red>Could not create the bots. Check the console.</red>"
  invalid-difficulty: "<red>Invalid difficulty. Use easy, medium, hard or terminator.</red>"
  no-location: "<red>This command needs a location (use it in game or give the coordinates).</red>"
  removed: "<yellow><amount> bot(s) named <white><name></white> removed.</yellow>"
  all-removed: "<yellow><amount> bot(s) permanently deleted.</yellow>"
  confirm-remove-all: "<red>This deletes every bot and the save. Type <white>/manhunt remove all confirm</white> to confirm.</red>"
  list-title: "<gold>Bots: <yellow><amount></yellow> (<green><alive> alive</green>)</gold>"
  list-line: "<gray>-</gray> <white><display-name></white> <dark_gray>(<name>)</dark_gray> <gray>phase</gray> <yellow><phase></yellow> <gray><difficulty> · health</gray> <red><health></red> <gray>· group</gray> <aqua><group></aqua> <gray>· target</gray> <white><target></white> <gray>· <location> · kills</gray> <yellow><kills></yellow> <dark_gray>[<state>]</dark_gray>"
  list-dead: "dead (respawning)"
  info: |-
    <gold><display-name></gold> <dark_gray>(<name>)</dark_gray>
    <gray>Alive: <white><alive></white> · Phase <yellow><phase></yellow> · <difficulty></gray>
    <gray>Health <red><health></red> · Hunger <white><hunger></white> · Kills <yellow><kills></yellow> · Aggression <white><aggression></white></gray>
    <gray>Group <aqua><group></aqua> · Target <white><target></white></gray>
    <gray>Location <white><location></white> · Speed <white><speed></white> blocks/s · On ground <white><on-ground></white></gray>
    <gray>AI: <yellow><state></yellow></gray>
  bot-not-found: "<red>Bot not found.</red>"
  players-only: "<red>Only players can use this.</red>"
  target-set: "<green>Every bot now chases <white><player></white>.</green>"
  target-cleared: "<green>Forced target removed: the bots choose on their own again.</green>"
  item-given: "<green>Item <white><item></white> given to every bot.</green>"
  invalid-tier: "<red>Unknown armor tier: <white><tier></white>. Use leather, chainmail, iron, gold, diamond or netherite.</red>"
  armor: "<green><white><tier></white> armor put on every bot.</green>"
  tp-one: "<green><white><bot></white> went to <white><player></white>.</green>"
  tp-all: "<green><amount> bot(s) brought to <white><player></white>.</green>"
  spawnpoint-bot: "<green>Respawn point of <white><bot></white> set at <white><pos></white>.</green>"
  spawnpoint-bot-cleared: "<green>Respawn point of <white><bot></white> removed.</green>"
  skin-ok: "<green>Skin of <white><player></white> applied to <white><bot></white>.</green>"
  skin-failed: "<red>Couldn't find the skin of <white><player></white>.</red>"
  reloaded: "<green>config.yml and the language files reloaded (language: <white><language></white>).</green>"

ability:
  started: "<green>Ability <white><ability></white> started.</green>"
  must-be-alive: "<red>You need to be alive.</red>"
  already-active: "<red>There's already an ability active against you.</red>"
  not-in-cave: "<red>You're not in a cave (Y below 60, no sky light).</red>"
  no-eligible-bot: "<red>No eligible bot (alive, targeting you, in the same world, free and in the needed phase).</red>"
  firework-out-of-range: "<red>No bot has you in firework range (about 64 blocks, no block in the way).</red>"
  arrow-out-of-range: "<red>No bot can reach you with an arrow, not even at full draw (too far for the height difference, or a block in the way).</red>"
  no-ambush-spot: "<red>Couldn't find a spot in the same cave for the ambush.</red>"
  unknown: "<red>Unknown ability. Use tnt-craft, bow-burst or firework-crossbow.</red>"

group:
  not-found: "<red>The group <white><group></white> doesn't exist.</red>"
  role: "<green>Group <white><group></white> is now <yellow><role></yellow>.</green>"
  invalid-role: "<red>Unknown role: <white><role></white>. Use hunter or escape.</red>"
  deleted: "<yellow>Group <white><group></white> deleted (<amount> bot(s) removed).</yellow>"
  phases: "<green>Phase progression <yellow><value></yellow> for <white><group></white> (<amount> bot(s)).</green>"
  chase: "<green>Group <white><group></white> chases players: <yellow><value></yellow>.</green>"
  spawnpoint: "<green>Respawn point of group <white><group></white> at <white><pos></white>.</green>"
  spawnpoint-cleared: "<green>Respawn point of group <white><group></white> removed.</green>"
  enemy-added: "<green><white><group></white> is now an enemy of <white><enemy></white>.</green>"
  enemy-removed: "<green><white><group></white> is no longer an enemy of <white><enemy></white>.</green>"

settings:
  title: "<gold>Manhunt* settings</gold> <gray>(/manhunt settings <option> <value>)</gray>"
  line: "<gray>-</gray> <yellow><key></yellow> <gray>=</gray> <white><value></white> <dark_gray>(<path>)</dark_gray>"
  effective-nodes: "pathnodes (effective)"
  changed: "<green><white><key></white> = <yellow><value></yellow></green>"
  current: "<gray><white><key></white> is <yellow><value></yellow>.</gray>"
  unknown: "<red>Unknown option: <white><key></white>. Use /manhunt settings to see them all.</red>"
  invalid: "<red><white><key></white>: <error></red>"
  error:
    boolean: "invalid value: use true or false."
    integer: "invalid whole number (<min> to <max>)."
    number: "invalid number (<min> to <max>)."
    choice: "invalid value. Options: <options>"

