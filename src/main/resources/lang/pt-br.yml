# --- nome e descrição de cada opção no menu (a chave é a do /manhunt settings) ---
options:
  language:
    name: "Idioma"
    description: "Idioma das mensagens e do menu: um arquivo da pasta lang/. Texto que faltar fica em inglês."
  tablist:
    name: "Bots na lista do TAB"
    description: "Bots aparecem na lista do TAB como jogadores (com skin e ping)."
  joinmessages:
    name: "Mensagens de entrada e saída"
    description: "\"X entrou no jogo\" / \"X saiu do jogo\" quando um bot é criado ou removido."
  deathmessages:
    name: "Mensagens de morte"
    description: "Mensagens de morte dos bots no padrão do jogo (respeita a gamerule de mensagens de morte)."
  serverlistcount:
    name: "Contar na lista de servidores"
    description: "Bots somam no número de jogadores online e nos nomes da lista de servidores."
  listcommand:
    name: "Bots no /list"
    description: "O /list inclui os bots (mesmo formato do jogo)."
  respectpvp:
    name: "Respeitar PvP desligado"
    description: "Com pvp desligado no mundo, os bots não batem em jogadores."
  mineskin:
    name: "Skin reserva pelo MineSkin"
    description: "Sem skin para o nome escolhido, usa a primeira imagem .png da pasta skins/ (ou o robô do mod), enviada uma vez ao MineSkin para ganhar assinatura."
  bothealth:
    name: "Vida máxima"
    description: "Vida máxima dos bots."
  botinvincible:
    name: "Bots invencíveis"
    description: "Bots não levam dano (só do void e /kill)."
  respawn:
    name: "Renascer depois de morrer"
    description: "Bots renascem 5 s depois de morrer."
  persistentbots:
    name: "Manter bots ao reiniciar"
    description: "Bots continuam existindo depois de reiniciar o servidor (bots.yml)."
  dropinventory:
    name: "Derrubar inventário ao morrer"
    description: "Bots derrubam o inventário ao morrer."
  gearpersistence:
    name: "Equipamento ao morrer"
    description: "O que acontece com a melhor espada/picareta/armadura quando o bot morre: mantém, mantém e derruba uma cópia, ou derruba e perde."
  phasemultiplier:
    name: "Duração das fases"
    description: "Multiplica a duração de cada fase de progressão."
  defaultdifficulty:
    name: "Dificuldade padrão"
    description: "Dificuldade usada quando o comando não informa: easy, medium, hard, terminator."
  autoeat:
    name: "Comer sozinho"
    description: "Bots comem quando ficam com fome."
  autogapple:
    name: "Maçã dourada em combate"
    description: "Bots comem maçã dourada em combate (fase 5+)."
  firewaterescape:
    name: "Apagar fogo com água"
    description: "Bots apagam o fogo com balde de água (fase 3+)."
  mobsattackbots:
    name: "Mobs atacam os bots"
    description: "Mobs hostis atacam os bots como atacam jogadores."
  aimsmoothness:
    name: "Suavidade da mira (ms)"
    description: "Suavidade da mira em milissegundos (0 = instantânea, como no mod por padrão)."
  targetpriority:
    name: "Prioridade jogador × mob"
    description: "Preferência entre jogador e mob: 5 = só jogadores, -5 = só mobs."
  targetmode:
    name: "Divisão dos alvos"
    description: "Como os bots dividem os jogadores: closest, equal, farthest."
