  autocapacities:
    name: "TNT e fogos automáticos"
    description: "Emboscada de TNT e besta com fogos automáticas (no mod ficavam travadas)."
  fireworkcrossbow:
    name: "Besta com fogos"
    description: "Besta com fogos (experimental no mod). O bot só atira com o jogador ao alcance (uns 64 blocos, sem bloco no caminho)."
  bowpressure:
    name: "Rajada de arco"
    description: "Rajada de arco quando o bot fica muito tempo sem acertar o jogador. Ele só atira se a flecha alcança o jogador."
  silentdeaths:
    name: "Mortes silenciosas"
    description: "O bot mais longe de cada jogador (200+ blocos) some e renasce mais perto."
  portalentrance:
    name: "Chegar por portal"
    description: "Bots chegam em outra dimensão saindo de um portal que o jogador vê."
  spawnmode:
    name: "Modo de spawn"
    description: "NORMAL: nasce no ponto. MANHUNT: nasce em roda e espera a caçada começar."
  countdown:
    name: "Contagem antes da caçada (s)"
    description: "Contagem (segundos) antes da caçada começar. 0 = soltam assim que alguém sai da roda."
  countdownonleave:
    name: "Contar só depois de sair da roda"
    description: "A contagem só começa quando um jogador que estava dentro da roda sai dela; até lá os bots esperam. Desligado = a contagem começa assim que os bots são criados."
  countdowninvulnerable:
    name: "Bots invulneráveis na roda"
    description: "Bots da roda não levam dano enquanto esperam e durante a contagem."
  ringradius:
    name: "Raio da roda (0 = automático)"
    description: "Raio da roda em blocos. 0 = automático (5 blocos + 1 a cada 5 bots)."
  ringcenter:
    name: "Centro da roda"
    description: "auto = a roda fica onde é criada; manual = no ponto marcado com /manhunt ring point."
  latejoin:
    name: "Quem entra no meio da caçada"
    description: "Quem entra com a caçada em andamento: hunted = vira alvo na hora; protected = fica sem ser alvo pelo tempo da contagem (no mínimo 5 s); out = não é caçado até a próxima caçada."
  playerlistmode:
    name: "Lista de jogadores"
    description: "off = todos podem ser caçados; allowlist = só os da lista são caçados e disparam a roda; blocklist = os da lista não são caçados nem disparam a roda."
  glowhunters:
    name: "Brilho nos caçadores"
    description: "Brilho (contorno visível através das paredes) nos caçadores."
  glowhunterscolor:
    name: "Cor do brilho dos caçadores"
    description: "Cor do brilho dos caçadores."
  glowescapers:
    name: "Brilho nos fugitivos"
    description: "Brilho nos bots de grupos fugitivos."
  glowescaperscolor:
    name: "Cor do brilho dos fugitivos"
    description: "Cor do brilho dos fugitivos."
  nametag:
    name: "Nome em cima do bot"
    description: "Nome visível em cima do bot."

