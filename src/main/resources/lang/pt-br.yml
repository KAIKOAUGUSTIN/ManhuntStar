# ==============================================================================
#  Manhunt* - Português (Brasil)
#  Formato MiniMessage: https://docs.advntr.dev/minimessage/format.html
#  As tags como <bot>, <phase> e <amount> são preenchidas pelo plugin; mantenha-as ao traduzir.
#  Chaves que faltarem usam o texto em inglês (en.yml). "version" muda quando os textos padrão
#  mudam: um arquivo mais antigo vai para lang/old/ e é trocado pelo novo.
# ==============================================================================

version: 1

prefix: "<dark_red><bold>Manhunt*</bold></dark_red> <dark_gray>»</dark_gray> "

help: |-
  <dark_red><bold>Manhunt*</bold></dark_red> <gray>(bots caçadores de ManHunt) ·</gray> <yellow>/manhunt menu</yellow> <gray>abre o menu</gray>
  <gold>Partida</gold>
  <yellow>/manhunt start</yellow> <gray>- solta as rodas e começa a caçada já</gray>
  <yellow>/manhunt pause · resume</yellow> <gray>- congela os bots e os relógios / continua</gray>
  <yellow>/manhunt target <player> · target clear</yellow> <gray>- todos atrás de um jogador / volta ao normal</gray>
  <yellow>/manhunt ring · ring point [x y z | clear]</yellow> <gray>- a roda e o ponto fixo dela</gray>
  <yellow>/manhunt players [add|remove <player> | mode off|allowlist|blocklist]</yellow> <gray>- quem é caçado</gray>
  <gold>Bots</gold>
  <yellow>/manhunt create <name> [amount] [difficulty] [skin <player>] [at <x y z>] [phase] [aggression]</yellow>
  <yellow>/manhunt remove <bot> · remove all confirm</yellow> <gray>- remove bots / apaga tudo</gray>
  <yellow>/manhunt list · info <bot> · tp <bot|all> [player]</yellow>
  <yellow>/manhunt skin <bot> <player> · spawnpoint <bot> [x y z | clear]</yellow>
  <yellow>/manhunt equip item <item> · equip armor <tier> · test <ability></yellow>
  <gold>Grupos</gold>
  <yellow>/manhunt group <group> role|enemy|spawnpoint|phases|chaseplayers|remove</yellow>
  <gold>Opções</gold>
  <yellow>/manhunt settings [option] [value] · reload</yellow> <gray>- sem opção mostra todas</gray>

common:
  "yes": "sim"
  "no": "não"
  "on": "ligado"
  "off": "desligado"
  none: "nenhum"
  automatic: "automático"

difficulty:
  easy: "Fácil"
  medium: "Médio"
  hard: "Difícil"
  terminator: "Terminator"

role:
  hunter: "caçador"
  escape: "fugitivo"

# --- fases ---
phase:
  jump: "<red>[SALTO DE FASE]</red> <white><bot></white> <gray>fase</gray> <yellow><from></yellow> <gray>→</gray> <gold><to></gold> <gray>(<reason> de <white><player></white>).</gray>"
  reason:
    nether: "entrou no Nether"
    diamonds: "5+ diamantes no inventário"
    lots-of-iron: "mais de 20 de ferro"
    iron: "ferro no inventário"
    wooden-weapon: "arma de madeira"
  upgrade: "<dark_red><bold>[BOTS MAIS FORTES]</bold></dark_red> <gold>Fase <phase> alcançada!</gold>"
  description:
    "1": "<gray>Bot básico: sem equipamento de fase; persegue, cava, faz pontes e se vira.</gray>"
    "2": "<gray>Espada de madeira e comida básica. Arma de madeira do jogador força esta fase.</gray>"
    "3": "<gray>Liberam a besta e o balde de água contra fogo; comida melhor.</gray>"
    "4": "<gray>Armadura de couro, espada de pedra, escudo, tridente com lealdade, cavalos e rajada de arco.</gray>"
    "5": "<gray>Armadura e espada de ferro, balde de lava e maçãs douradas.</gray>"
    "6": "<gray>Ferro com Proteção I, drops melhores e barcos contra alvos na água.</gray>"
    "7": "<gray>Espada de diamante, parte da armadura de diamante e drops mais fortes.</gray>"
    "8": "<gray>Diamante completo com Proteção II e espada com Afiação II.</gray>"
    "9": "<gray>Mantém o diamante encantado e a recarga da pérola cai 50%.</gray>"
    "10": "<gray>Mantém o diamante encantado e a recarga da pérola cai 75%.</gray>"
    "11": "<gray>Os bots ficaram mais fortes.</gray>"
    "12": "<dark_red>Fase final (só Terminator): armadura de netherite e espada de netherite com Repulsão.</dark_red>"

# --- roda e contagem antes da caçada ---
countdown:
  ring-created: "<gold>Os caçadores estão na roda.</gold> <gray>Quando um jogador sair dela, começa a contagem de</gray> <yellow><seconds></yellow> <gray>segundos. Use /manhunt start para começar já.</gray>"
  ring-created-no-countdown: "<gold>Os caçadores estão na roda.</gold> <gray>Quando um jogador sair dela, a caçada começa. Use /manhunt start para começar já.</gray>"
  bar-waiting: "<yellow>Saia da roda para começar</yellow> <gray>(<seconds>s de vantagem)</gray>"
  bar-waiting-no-countdown: "<yellow>Saia da roda para começar a caçada</yellow>"
  left: "<yellow><player></yellow> <gold>saiu da roda!</gold>"
  left-and-counting: "<yellow><player></yellow> <gold>saiu da roda! A caçada começa em</gold> <yellow><seconds></yellow> <gold>segundos.</gold>"
  started: "<gold>A caçada começa em <yellow><seconds></yellow> segundos!</gold> <gray>Use /manhunt start para começar já.</gray>"
  bar: "<red>A caçada começa em</red> <yellow><seconds>s</yellow>"
  title-number: "<red><bold><seconds></bold></red>"
  subtitle: "<gray>Prepare-se...</gray>"
  begun-title: "<dark_red><bold>A caçada começou!</bold></dark_red>"
  begun-subtitle: "<gray>Corra.</gray>"
  begun: "<dark_red>A caçada começou!</dark_red>"
  nothing: "<gray>Não há bots esperando na roda.</gray>"

ring:
  info: |-
    <gold>Roda</gold> <gray>· raio</gray> <white><radius></white> <gray>· centro</gray> <white><center></white> <gray>· ponto</gray> <white><point></white>
    <gray>Rodas esperando agora:</gray> <white><rings></white> <gray>(raio: /manhunt settings ringradius <blocos|auto>)</gray>
  point-set: "<green>Ponto da roda marcado em <white><pos></white> (<white><world></white>). As próximas rodas nascem aqui (centro da roda: manual).</green>"
  point-cleared: "<green>Ponto da roda apagado. As rodas voltam a nascer onde são criadas (centro da roda: auto).</green>"
  no-point: "<yellow>O centro da roda está em manual, mas não há ponto marcado (ou o mundo dele não está carregado): a roda fica onde você está. Marque com /manhunt ring point.</yellow>"

# --- quem é caçado: lista de jogadores e quem entra no meio ---
player-list:
  info: "<gold>Lista de jogadores</gold> <gray>(<mode>):</gray> <white><names></white>"
  empty: "ninguém"
  added: "<green><white><player></white> entrou na lista.</green>"
  already-listed: "<yellow><white><player></white> já está na lista.</yellow>"
  removed: "<green><white><player></white> saiu da lista.</green>"
  not-listed: "<yellow><white><player></white> não está na lista.</yellow>"
  off-warning: "<gray>A lista está desligada: use /manhunt players mode allowlist ou blocklist para ela valer.</gray>"
  mode: "<green>Lista de jogadores: <yellow><mode></yellow>.</green> <gray><explanation></gray>"
  explanation:
    "off": "Todos podem ser caçados e disparar a roda."
    allowlist: "Só os da lista são caçados e disparam a roda."
    blocklist: "Os da lista não são caçados nem disparam a roda."

hunt:
  joined-hunted: "<red>A caçada está em andamento: você já é um alvo!</red>"
  joined-protected: "<gold>A caçada está em andamento.</gold> <gray>Você fica</gray> <yellow><seconds></yellow> <gray>segundos protegido dos caçadores.</gray>"
  joined-out: "<gray>A caçada está em andamento. Você não será caçado até a próxima.</gray>"
  protection-bar: "<green>Protegido dos caçadores:</green> <yellow><seconds>s</yellow>"
  protection-ended-bar: "<red>Sua proteção acabou!</red>"
  protection-ended: "<red>Sua proteção acabou: os caçadores agora vêm atrás de você!</red>"

# --- pausa ---
pause:
  bar: "<yellow><bold>Caçada pausada</bold></yellow> <gray>· os bots estão congelados</gray>"
  paused: "<yellow>Caçada pausada:</yellow> <gray>os bots estão congelados e invencíveis, e a contagem, a proteção e as fases pararam.</gray>"
  resumed: "<green>A caçada continua!</green>"
  already-paused: "<gray>A caçada já está pausada. Use /manhunt resume para continuar.</gray>"
  not-paused: "<gray>A caçada não está pausada.</gray>"
  state: "pausado"

