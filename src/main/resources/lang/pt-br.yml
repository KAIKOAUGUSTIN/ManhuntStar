  no-location: "<red>Este comando precisa de um local (use no jogo ou informe as coordenadas).</red>"
  removed: "<yellow><amount> bot(s) com o nome <white><name></white> removidos.</yellow>"
  all-removed: "<yellow><amount> bot(s) apagados permanentemente.</yellow>"
  confirm-remove-all: "<red>Isso apaga todos os bots e o salvamento. Digite <white>/manhunt remove all confirm</white> para confirmar.</red>"
  list-title: "<gold>Bots: <yellow><amount></yellow> (<green><alive> vivos</green>)</gold>"
