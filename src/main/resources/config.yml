# ==============================================================================
#  Manhunt* configuration
#  Everything here can also be changed in game with
#  /manhunt settings <key> <value> and in /manhunt menu.
#  The command key of each option is in square brackets.
# ==============================================================================

general:
  # Language of the plugin's messages and menu: a file name from the lang/ folder (en, pt-br, fr, ru, zh-cn
  # or one you add). Missing texts fall back to English. [language]
  language: en
  # Bots show up in the TAB list as players (with skin and ping). [tablist]
  tab-list: true
  # "X joined the game" / "X left the game" when a bot is created or removed. [joinmessages]
  join-leave-messages: true
  # Bot death messages in the vanilla format (follows the death messages gamerule). [deathmessages]
  death-messages: true
  # Bots count towards the online players and the names in the server list. [serverlistcount]
  count-in-server-list: true
  # /list includes the bots (same format as vanilla). [listcommand]
  include-in-list-command: true
  # With pvp off in the world, bots don't hit players. [respectpvp]
  respect-disabled-pvp: false
  # With no skin for the chosen name, use the first .png in the skins/ folder (or the mod's robot),
  # uploaded once to MineSkin to get a signature, like the mod did. [mineskin]
  mineskin-fallback-skin: true

bots:
  # Bot max health. [bothealth]
  max-health: 20
  # Bots take no damage (only from the void and /kill). [botinvincible]
  invincible: false
  # Bots respawn 5 s after dying. [respawn]
  respawn: true
  # Bots keep existing after a server restart (bots.yml). [persistentbots]
  persistent: true
  # Bots drop their inventory when they die. [dropinventory]
  drop-inventory: true
  # What happens to the best sword/pickaxe/armor when the bot dies: [gearpersistence]
  #   keep_on_respawn_no_drop = keeps it, no drop | keep_and_drop = keeps it and drops a copy
  #   drop_and_lose = drops it and loses it
  gear-persistence: keep_on_respawn_no_drop
  # Multiplies the length of each progression phase. [phasemultiplier]
  phase-duration-multiplier: 1.0
  # Difficulty used when the command doesn't give one: easy, medium, hard, terminator. [defaultdifficulty]
  default-difficulty: terminator
  # Bots eat when they get hungry. [autoeat]
  auto-eat: true
  # Bots eat golden apples in combat (phase 5+). [autogapple]
  auto-golden-apple: true
  # Bots put out fire with a water bucket (phase 3+). [firewaterescape]
  extinguish-with-water: true
  # Hostile mobs attack the bots like they attack players. [mobsattackbots]
  mobs-attack-bots: true
  # Mob types that never target the bots (e.g. CREEPER, PHANTOM).
  mobs-that-ignore-bots: []
  # Aim smoothing in milliseconds (0 = instant, the mod's default). [aimsmoothness]
  aim-smoothness-ms: 0

combat:
  # Preference between players and mobs: 5 = players only, -5 = mobs only. [targetpriority]
  target-priority: 2.0
  # How the bots split the players: closest, equal, farthest. [targetmode]
  target-mode: equal
  # Trident (phase 4+). [allowtrident]
  trident: true
  # Crossbow (phase 3+). [allowcrossbow]
  crossbow: true
  # Mounted spear (phase 4+): on horseback the bot charges the target with the phase's spear, rides past,
  # turns around and charges again. On foot it uses the sword. [allowspear]
  mounted-spear: true
  # Inaccuracy multiplier for arrows/tridents. [projinaccuracy]
  projectile-inaccuracy: 1.0
  # Humanization (0 to 1): aim mistakes, missed hits and an irregular rhythm. [humanize]
  humanization: 0.0
  # Chance to miss a hit (multiplied by the humanization). [meleemisschance]
  melee-miss-chance: 0.12
  # Random delay between hits, in ticks. [meleedelayjitter]
  melee-delay-jitter: 4
  # How much the hit reach can vary. [meleereachvariance]
  melee-reach-variance: 0.35
  # Aim offset on hits. [meleeaimoffset]
  melee-aim-offset: 0.25
  # Variation in the hit rhythm. [meleespamvariance]
  melee-rhythm-variance: 3

mobility:
  # Towers and bridges near the target (up to 3 blocks horizontally). [allowtowering]
  towering: true
  # Ender pearls. [allowpearl]
  ender-pearls: true
  # Ender pearl cooldown multiplier. [pearlcooldownmult]
  pearl-cooldown-multiplier: 1.0
  # Where the bots use ender pearls: nether, both, overworld. [pearldimension]
  pearl-dimension: nether
  # Horses (phase 4+). [allowhorse]
  horses: true
  # Boats: chase whoever is in a boat or swimming, and cross lakes by boat when it beats walking around. [allowboat]
  boats: true
  # Elytra to reach far targets. [allowelytra]
  elytra: false
  # Bots very far from the target reappear hidden near it. [allowredistribution]
  redistribute: true
  # Distance (blocks) from which a bot gets redistributed. [redistdistance]
  redistribute-distance: 200
  # Minimum time until the bots follow the target to another dimension. [minnetherdelay]
  min-dimension-delay-seconds: 30
  # Maximum time until the bots follow the target to another dimension. [maxnetherdelay]
  max-dimension-delay-seconds: 60

pathfinding:
  # Planner: ASTAR or DUMB. [pathmode]
  mode: ASTAR
  # A* greediness (higher = faster, worse paths). [pathgreediness]
  greediness: 1.5
  # A* node limit. [pathnodes]
  node-limit: 2500
  # Adjusts the node limit by itself based on the computation time. [pathdynamicnodes]
  dynamic-node-limit: true
  # With no path, walk straight to the target. [pathfallback]
  dumb-fallback: true
  # Computes paths off the main thread. [pathasync]
  async: true
  # Shows the path as particles to whoever has manhuntstar.admin. [pathdebug]
  debug-particles: false

tactics:
  # Cave ambush with a bed (the bot respawns near the bed). [caveambush]
  cave-ambush: true
  # Seconds between one bot and the next going for the ambush (1 = like the mod). [caveambushcooldown]
  cave-ambush-cooldown-seconds: 1
  # Automatic TNT ambush and firework crossbow (locked in the mod). [autocapacities]
  auto-abilities: false
  # Firework crossbow (experimental in the mod). Flight duration 3 rocket; the bot only shoots with the player
  # in range (about 64 blocks, no block in the way). [fireworkcrossbow]
  firework-crossbow: false
  # Bow burst when the bot goes too long without hitting the player. It draws the bow as much as it needs and
  # only shoots if the arrow reaches the player (height difference counts). [bowpressure]
  bow-pressure: true
  # The bot farthest from each player (200+ blocks) vanishes and respawns closer. [silentdeaths]
  silent-deaths: true
  # Bots arrive in another dimension through a portal the player can see. [portalentrance]
  portal-entrance: true

manhunt:
  # NORMAL: spawns at the point. MANHUNT: spawns in a ring and waits for the hunt to start. [spawnmode]
  spawn-mode: MANHUNT
  # Countdown (seconds) before the hunt starts. 0 = released as soon as someone leaves the ring. [countdown]
  countdown-seconds: 20
  # The countdown only starts when a player who was inside the ring leaves it (the first one counts);
  # until then the bots wait. false = the countdown starts as soon as the bots are created. [countdownonleave]
  countdown-on-ring-leave: true
  # Ring bots take no damage while waiting and during the countdown. [countdowninvulnerable]
  invulnerable-during-countdown: true
  # Ring radius in blocks. 0 = automatic (5 blocks + 1 every 5 bots). [ringradius]
  ring-radius: 0
  # auto = the ring stays where it's created (your position or the "at x y z" of /manhunt create);
  # manual = at the point set with /manhunt ring point. [ringcenter]
  ring-center: auto
  # Who joins the server while the hunt is running: hunted = becomes a target right away;
  # protected = isn't a target for the ring's countdown time (at least 5 s);
  # out = isn't hunted until the next hunt. [latejoin]
  late-join: protected
  # off = everyone can be hunted; allowlist = only the listed players are hunted and trigger the ring;
  # blocklist = the listed players aren't hunted and don't trigger the ring. [playerlistmode]
  player-list-mode: "off"
  # Names in the player list. Edit with /manhunt players add|remove <player>.
  player-list: []

appearance:
  # Glow (outline visible through walls) on the hunters. [glowhunters]
  glow-hunters: false
  # Hunters' glow color. [glowhunterscolor]
  glow-hunters-color: red
  # Glow on the bots of escape groups. [glowescapers]
  glow-escapers: false
  # Escapers' glow color. [glowescaperscolor]
  glow-escapers-color: aqua
  # Name visible above the bot. [nametag]
  show-name-tag: true
