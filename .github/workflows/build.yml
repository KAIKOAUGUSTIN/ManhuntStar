# Build: compiles, runs the tests and keeps the jars as an artifact, on every PR and on every push to
# dev and main: the Paper plugin and the Fabric and NeoForge mods (one per Minecraft version in
# gradle.properties). They are on the run's Summary page (Artifacts) for 14 days.
#
# Every push to dev (a merged PR or a direct push; not PRs while open) is also posted to Discord as a
# card with the commits and the plugin's jar (the mods are in the artifact), mentioning
# DISCORD_ROLE_ID, when the DISCORD_WEBHOOK_URL secret is set (Settings > Secrets and variables >
# Actions).
#
# Each run is also analyzed by SonarQube Cloud (project kaikoaugustin_manhunt-star) when the SONAR_TOKEN
# secret is available; PRs from forks and Dependabot don't get it and skip the analysis.
name: Build

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so SonarQube Cloud can tell which code is new

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # build also runs the tests and compiles against the newest Paper API (compileAgainstLatest)
      - name: Build and test
        run: ./gradlew build

      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::SONAR_TOKEN is not available in this run; skipping the SonarQube Cloud analysis."
            exit 0
          fi
          ./gradlew sonar

      - name: Artifact name
        id: artifact
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$PR" ]; then
            echo "name=ManhuntStar-pr$PR-${SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "name=ManhuntStar-$GITHUB_REF_NAME-${SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the jars
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/libs/ManhuntStar-*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name || 'ManhuntStar' }}-tests
          path: "*/build/reports/tests/"
          retention-days: 14

      - name: Discord notification
        if: >-
          (success() || failure())
          && github.event_name == 'push'
          && github.ref == 'refs/heads/dev'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: "1566987694830260326"
          STATUS: ${{ job.status }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          JAR="build/libs/ManhuntStar-$(sed -n 's/^version=//p' gradle.properties).jar"
          export JAR
          bash .github/scripts/discord-build.sh
