# Build: compiles, runs the tests and keeps the jar as an artifact, on every PR and on every push to
# dev and main. The jar is on the run's Summary page (Artifacts) for 14 days.
name: Build

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build

      - name: Artifact name
        id: artifact
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$PR" ]; then
            echo "name=ManhuntStar-pr$PR-${SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "name=ManhuntStar-$GITHUB_REF_NAME-${SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the jar
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/libs/ManhuntStar-*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.artifact.outputs.name || 'ManhuntStar' }}-tests
          path: build/reports/tests/
          retention-days: 14
