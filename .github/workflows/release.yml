# Automatic release: every PR merged into main makes a new version.
#
# 1. Bumps the version in gradle.properties (patch; a "minor" or "major" label on the PR changes that,
#    "skip-release" skips everything).
# 2. Builds and tests with the new version.
# 3. Commits the version and CHANGELOG.md to main, creates the vX.Y.Z tag and the release with the jars
#    (the Paper plugin and the Fabric and NeoForge mods, one per Minecraft version).
#    The release notes group the PR's commits by the prefix of their message: "New:", "Changed:",
#    "Fixed:", "Updated:" and "Removed:" (no prefix = Changed, Dependabot = Updated). The same notes
#    go to CHANGELOG.md, the GitHub release, Modrinth, Hangar, CurseForge and Discord.
# 4. Publishes it on Modrinth (every jar), Hangar (the plugin) and CurseForge (the mods), each one when
#    its secret is set.
# 5. Announces the release on Discord (when a webhook secret is set).
# 6. Brings main back into dev, so dev starts from the new version.
#
# The pushes to main and dev use the RELEASE_TOKEN secret (a token from someone in the rulesets'
# bypass list): the default Actions token is blocked by the PR and status check rules.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # "sem-release" is the old name of the skip-release label
    if: >-
      github.event.pull_request.merged == true
      && !contains(github.event.pull_request.labels.*.name, 'skip-release')
      && !contains(github.event.pull_request.labels.*.name, 'sem-release')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Check RELEASE_TOKEN
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::The RELEASE_TOKEN secret is missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      # without it the jars would send no statistics and no error reports
      - name: Check FASTSTATS_TOKEN
        env:
          FASTSTATS_TOKEN: ${{ secrets.FASTSTATS_TOKEN }}
        run: |
          # the same check as the build (build.gradle.kts), with the reason; the token itself is never printed
          token="${FASTSTATS_TOKEN#"${FASTSTATS_TOKEN%%[![:space:]]*}"}"
          token="${token%"${token##*[![:space:]]}"}"
          if [ -z "$FASTSTATS_TOKEN" ]; then
            echo "::error::The FASTSTATS_TOKEN secret is missing (Settings > Secrets and variables > Actions)."
            exit 1
          elif [ -z "$token" ]; then
            echo "::error::The FASTSTATS_TOKEN secret only has spaces or line breaks: paste the FastStats project token into it again."
            exit 1
          elif ! printf '%s' "$token" | grep -Eq '^[a-z0-9]{32}$'; then
            echo "::error::The FASTSTATS_TOKEN secret isn't a FastStats project token: it should be 32 lowercase letters and digits (${#token} characters now)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Compute the version
        id: version
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          current=$(sed -n 's/^version=//p' gradle.properties)
          IFS=. read -r major minor patch <<< "$current"
          if jq -e 'index("major")' <<< "$LABELS" > /dev/null; then
            major=$((major + 1)); minor=0; patch=0
          elif jq -e 'index("minor")' <<< "$LABELS" > /dev/null; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          next="$major.$minor.$patch"
          if git rev-parse -q --verify "refs/tags/v$next" > /dev/null; then
            echo "::error::The tag v$next already exists."
            exit 1
          fi
          sed -i "s/^version=.*/version=$next/" gradle.properties
          echo "previous=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Version $current -> $next"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # pinned to a commit: this job hands secrets to the build (Dependabot keeps it up to date)
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build and test
        env:
          # FastStats project token, put into the plugin and the mods (only release jars send statistics)
          FASTSTATS_TOKEN: ${{ secrets.FASTSTATS_TOKEN }}
        run: ./gradlew build

      - name: Release notes and CHANGELOG
        env:
          NEXT: ${{ steps.version.outputs.next }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" \
            --jq '.[] | select((.parents | length) == 1) | [.sha, (.author.login // ""), (.commit.message | split("\n")[0])] | @tsv' \
            > "$RUNNER_TEMP/commits.tsv"
          bash .github/scripts/release-notes.sh "$NEXT" "$PREVIOUS" "$RUNNER_TEMP/commits.tsv" "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Commit and tag on main
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties CHANGELOG.md
          git commit -m "Version $VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"

      - name: Create the release
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          gh release create "v$VERSION" "build/libs/ManhuntStar-$VERSION.jar" build/libs/ManhuntStar-*-"$VERSION"+*.jar \
            --title "ManhuntStar $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag

      # Modrinth, Hangar and CurseForge: each one is skipped while its secret (MODRINTH_TOKEN,
      # HANGAR_API_KEY, CURSEFORGE_TOKEN) is missing. The MODRINTH_PROJECT, HANGAR_PROJECT and
      # CURSEFORGE_PROJECT_ID variables change the projects (defaults: manhuntstar, ManhuntStar and
      # 1793171). A failed upload shows up as an error without stopping the
      # release; the Publish workflow can send that version again.
      - name: Publish on Modrinth
        continue-on-error: true
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT }}
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          failed=0
          for jar in "build/libs/ManhuntStar-$VERSION.jar" build/libs/ManhuntStar-*-"$VERSION"+*.jar; do
            bash .github/scripts/publish-modrinth.sh "$VERSION" "$RUNNER_TEMP/notes.md" "$jar" || failed=1
          done
          exit $failed

      - name: Publish on Hangar
        continue-on-error: true
        env:
          HANGAR_API_KEY: ${{ secrets.HANGAR_API_KEY }}
          HANGAR_PROJECT: ${{ vars.HANGAR_PROJECT }}
          VERSION: ${{ steps.version.outputs.next }}
        run: bash .github/scripts/publish-hangar.sh "$VERSION" "$RUNNER_TEMP/notes.md" "build/libs/ManhuntStar-$VERSION.jar"

      - name: Publish on CurseForge
        continue-on-error: true
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          if [ -z "$CURSEFORGE_TOKEN" ]; then
            echo "CURSEFORGE_TOKEN is not set; skipping CurseForge."
            exit 0
          fi
          failed=0
          for jar in build/libs/ManhuntStar-*-"$VERSION"+*.jar; do
            bash .github/scripts/publish-curseforge.sh "$VERSION" "$RUNNER_TEMP/notes.md" "$jar" || failed=1
          done
          exit $failed

      # The DISCORD_RELEASE_WEBHOOK_URL secret (or DISCORD_WEBHOOK_URL, when there's no separate
      # release channel); skipped when neither is set. A failed post doesn't fail the release.
      - name: Announce on Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: "1566863017587511376"
          VERSION: ${{ steps.version.outputs.next }}
        run: bash .github/scripts/discord-release.sh "$VERSION" "$RUNNER_TEMP/notes.md" "build/libs/ManhuntStar-$VERSION.jar"

      - name: Bring the version into dev
        run: |
          git fetch origin dev
          if git merge-base --is-ancestor origin/dev HEAD; then
            git push origin HEAD:dev
          else
            git checkout -B dev origin/dev
            if git merge --no-edit main && git push origin dev; then
              echo "main merged into dev."
            else
              echo "::warning::Could not merge main into dev automatically; merge it by hand."
            fi
          fi
