version: 2

registries:
  papermc:
    type: maven-repository
    url: https://repo.papermc.io/repository/maven-public/
  faststats:
    type: maven-repository
    url: https://repo.faststats.dev/releases

updates:
  # Gradle dependencies (gradle/libs.versions.toml) and the Gradle Wrapper itself.
  - package-ecosystem: gradle
    directory: /
    # PRs go to dev; main only receives from dev (and every merge into main becomes a release)
    target-branch: dev
    registries:
      - papermc
      - faststats
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      junit:
        patterns:
          - "org.junit*"

  # Actions used by the workflows (.github/workflows)
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
